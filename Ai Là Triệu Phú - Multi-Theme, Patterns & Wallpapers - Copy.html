<!DOCTYPE html>

<html lang="vi" data-theme="vintage" style="--wallpaper-url: url(&quot;https://images.unsplash.com/photo-1467269204594-9661b134dd2b?auto=format&fit=crop&w=1600&q=75&quot;); --wallpaper-opacity: 0.22;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Ai Là Triệu Phú - Multi-Theme, Patterns & Wallpapers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Default Theme: Game Show Classic (Dark) */
            --bg-color: #060919;
            --panel-bg: #111638;
            --header-border: #2c3673;
            --accent-color: #ffd700;
            --accent-text: #000000;
            --btn-bg: #1b2454;
            --btn-border: #4a59a8;
            --btn-hover: #2b3980;
            --text-main: #ffffff;
            --text-muted: #8a94c7;
            --q-bg-top: #1d265c;
            --q-bg-bottom: #0d1233;
            --input-bg: #060919;
            --sub-panel-bg: #0b0e26;
            --correct-green: #28a745;
            --wrong-red: #dc3545;
            --pattern-color: rgba(255, 215, 0, 0.08);
            --pattern-secondary: rgba(74, 89, 168, 0.12);
            --wallpaper-url: none;
            --wallpaper-opacity: 0.22;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Mặc định đã cộng thêm 10 lần ấn + (1.3 + 10*0.14 = 2.70rem; 1.1 + 10*0.11 = 2.20rem) */
            --question-size: 2.70rem;
            --answer-size: 2.20rem;
        }

        /* THEME: VINTAGE (LIGHT PARCHMENT & WARM SEPIA) */
        [data-theme="vintage"] {
            --bg-color: #f5ede0;
            --panel-bg: #eadbc3;
            --header-border: #bda174;
            --accent-color: #8c4a27;
            --accent-text: #fdf9f2;
            --btn-bg: #fbf5ea;
            --btn-border: #b39464;
            --btn-hover: #e6d5b8;
            --text-main: #2e2116;
            --text-muted: #6e5843;
            --q-bg-top: #fdf8ef;
            --q-bg-bottom: #e8d8bc;
            --input-bg: #fdfaf4;
            --sub-panel-bg: #e2d0b1;
            --correct-green: #2f7a52;
            --wrong-red: #b83232;
            --pattern-color: rgba(140, 74, 39, 0.09);
            --pattern-secondary: rgba(168, 139, 94, 0.13);
            --font-family: 'Lora', 'Times New Roman', Times, serif;
        }

        /* THEME: CHÂU ÂU (LIGHT IVORY, EMERALD & GOLD) */
        [data-theme="europe"] {
            --bg-color: #eef5f2;
            --panel-bg: #dcebe4;
            --header-border: #8fb8a6;
            --accent-color: #16654e;
            --accent-text: #ffffff;
            --btn-bg: #fafdfb;
            --btn-border: #7aa894;
            --btn-hover: #d1e5dc;
            --text-main: #122620;
            --text-muted: #4b6e63;
            --q-bg-top: #ffffff;
            --q-bg-bottom: #d6e8e0;
            --input-bg: #f6fbf8;
            --sub-panel-bg: #cfe3da;
            --correct-green: #15803d;
            --wrong-red: #dc2626;
            --pattern-color: rgba(22, 101, 78, 0.09);
            --pattern-secondary: rgba(143, 184, 166, 0.16);
            --font-family: 'Playfair Display', 'Lora', Georgia, serif;
        }

        /* THEME: ĐÔNG ÂU (LIGHT FROST SLATE & CRIMSON) */
        [data-theme="easteurope"] {
            --bg-color: #f1f4f8;
            --panel-bg: #dfe6ef;
            --header-border: #9fb0c7;
            --accent-color: #c82333;
            --accent-text: #ffffff;
            --btn-bg: #fbfcfe;
            --btn-border: #8fa2bd;
            --btn-hover: #d4dde9;
            --text-main: #17202a;
            --text-muted: #526278;
            --q-bg-top: #ffffff;
            --q-bg-bottom: #dae2ec;
            --input-bg: #f8fafc;
            --sub-panel-bg: #d0dae6;
            --correct-green: #1e7e68;
            --wrong-red: #c82333;
            --pattern-color: rgba(200, 35, 51, 0.08);
            --pattern-secondary: rgba(143, 162, 189, 0.15);
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* THEME: ĐÔNG Á (LIGHT SILK CREAM, VERMILION & AMBER GOLD) */
        [data-theme="eastasia"] {
            --bg-color: #fbf3e8;
            --panel-bg: #f2e1c9;
            --header-border: #d1a36b;
            --accent-color: #b91c1c;
            --accent-text: #fff9f0;
            --btn-bg: #fffaf3;
            --btn-border: #c69256;
            --btn-hover: #ecd6b8;
            --text-main: #2b140d;
            --text-muted: #7a4b38;
            --q-bg-top: #fffcf7;
            --q-bg-bottom: #edd9bc;
            --input-bg: #fffdf9;
            --sub-panel-bg: #e7cfa9;
            --correct-green: #1f7a4c;
            --wrong-red: #b91c1c;
            --pattern-color: rgba(185, 28, 28, 0.08);
            --pattern-secondary: rgba(209, 163, 107, 0.18);
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* THEME: NHẬT BẢN (LIGHT WASHI & SAKURA/INDIGO) */
        [data-theme="japan"] {
            --bg-color: #f7f4f8;
            --panel-bg: #eae3f0;
            --header-border: #b8a7c7;
            --accent-color: #9d3662;
            --accent-text: #ffffff;
            --btn-bg: #fcfafe;
            --btn-border: #a894ba;
            --btn-hover: #e1d8ea;
            --text-main: #1e2436;
            --text-muted: #58627a;
            --q-bg-top: #ffffff;
            --q-bg-bottom: #e3dbe9;
            --input-bg: #faf8fc;
            --sub-panel-bg: #dcd2e6;
            --correct-green: #247a5e;
            --wrong-red: #c92a4d;
            --pattern-color: rgba(157, 54, 98, 0.08);
            --pattern-secondary: rgba(168, 148, 186, 0.16);
            --font-family: 'Segoe UI', 'Hiragino Sans', Meiryo, sans-serif;
        }

        /* THEME: SÁNG TỐI GIẢN (LIGHT CLASSROOM) */
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --header-border: #cbd5e1;
            --accent-color: #1d4ed8;
            --accent-text: #ffffff;
            --btn-bg: #f8fafc;
            --btn-border: #94a3b8;
            --btn-hover: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #475569;
            --q-bg-top: #ffffff;
            --q-bg-bottom: #e2e8f0;
            --input-bg: #f8fafc;
            --sub-panel-bg: #f1f5f9;
            --correct-green: #16a34a;
            --wrong-red: #dc2626;
            --pattern-color: rgba(29, 78, 216, 0.07);
            --pattern-secondary: rgba(100, 116, 139, 0.08);
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            position: relative;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* --- LỚP ẢNH NỀN & HỌA TIẾT TRANG TRÍ --- */
        .bg-wallpaper-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: var(--wallpaper-url);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: var(--wallpaper-opacity);
            transition: opacity 0.3s ease, background-image 0.3s ease;
        }

        .bg-pattern-layer {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            transition: background-image 0.3s ease, opacity 0.3s ease;
        }

        .bg-pattern-layer[data-pattern="none"] {
            background-image: none;
        }

        .bg-pattern-layer[data-pattern="classic"] {
            background-image:
                radial-gradient(circle at 50% 35%, var(--pattern-color) 0%, transparent 65%),
                linear-gradient(to right, var(--pattern-secondary) 1px, transparent 1px),
                linear-gradient(to bottom, var(--pattern-secondary) 1px, transparent 1px);
            background-size: 100% 100%, 36px 36px, 36px 36px;
        }

        .bg-pattern-layer[data-pattern="vintage"] {
            background-image:
                radial-gradient(var(--pattern-color) 1.25px, transparent 1.25px),
                repeating-linear-gradient(45deg, transparent, transparent 22px, var(--pattern-secondary) 22px, var(--pattern-secondary) 23px);
            background-size: 20px 20px, 64px 64px;
        }

        .bg-pattern-layer[data-pattern="europe"] {
            background-image:
                radial-gradient(circle at 16px 16px, var(--pattern-color) 2px, transparent 2.5px),
                radial-gradient(circle at 48px 48px, var(--pattern-color) 2px, transparent 2.5px),
                repeating-linear-gradient(30deg, var(--pattern-secondary) 0px, var(--pattern-secondary) 1px, transparent 1px, transparent 28px),
                repeating-linear-gradient(-30deg, var(--pattern-secondary) 0px, var(--pattern-secondary) 1px, transparent 1px, transparent 28px);
            background-size: 64px 64px;
        }

        .bg-pattern-layer[data-pattern="easteurope"] {
            background-image:
                linear-gradient(135deg, var(--pattern-color) 25%, transparent 25%),
                linear-gradient(225deg, var(--pattern-color) 25%, transparent 25%),
                linear-gradient(45deg, var(--pattern-secondary) 25%, transparent 25%),
                linear-gradient(315deg, var(--pattern-secondary) 25%, transparent 25%);
            background-position: 24px 0, 24px 0, 0 0, 0 0;
            background-size: 48px 48px;
        }

        .bg-pattern-layer[data-pattern="eastasia"] {
            background-image:
                radial-gradient(circle at 24px 24px, transparent 8px, var(--pattern-color) 8.5px, var(--pattern-color) 10px, transparent 10.5px),
                linear-gradient(to right, var(--pattern-secondary) 1px, transparent 1px),
                linear-gradient(to bottom, var(--pattern-secondary) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        .bg-pattern-layer[data-pattern="japan"] {
            background-image:
                radial-gradient(circle at 50% 100%, transparent 10px, var(--pattern-color) 10.5px, var(--pattern-color) 12px, transparent 12.5px, transparent 18px, var(--pattern-secondary) 18.5px, var(--pattern-secondary) 20px, transparent 20.5px),
                radial-gradient(circle at 0% 100%, transparent 10px, var(--pattern-color) 10.5px, var(--pattern-color) 12px, transparent 12.5px, transparent 18px, var(--pattern-secondary) 18.5px, var(--pattern-secondary) 20px, transparent 20.5px),
                radial-gradient(circle at 100% 100%, transparent 10px, var(--pattern-color) 10.5px, var(--pattern-color) 12px, transparent 12.5px, transparent 18px, var(--pattern-secondary) 18.5px, var(--pattern-secondary) 20px, transparent 20.5px);
            background-size: 40px 24px;
        }

        .bg-pattern-layer[data-pattern="dots"] {
            background-image: radial-gradient(var(--pattern-color) 1.5px, transparent 1.5px);
            background-size: 22px 22px;
        }

        /* --- HEADER --- */
        header {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--header-border);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 54px;
            z-index: 20;
            gap: 7px;
            flex-wrap: wrap;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            color: var(--accent-color);
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .hamburger-btn {
            background: none;
            border: 1px solid var(--btn-border);
            color: var(--accent-color);
            font-size: 1.15rem;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            line-height: 1;
        }

        .hamburger-btn:hover {
            background-color: var(--btn-hover);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        button, select {
            background-color: var(--btn-bg);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 9px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            font-family: inherit;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }

        select {
            outline: none;
            padding: 5px 7px;
        }

        select option {
            background-color: var(--panel-bg);
            color: var(--text-main);
        }

        button:hover, select:hover {
            background-color: var(--btn-hover);
        }

        button.btn-active {
            background-color: var(--accent-color);
            color: var(--accent-text);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
            border-color: var(--text-muted);
            color: var(--text-muted);
        }

        button.btn-success {
            background-color: var(--correct-green);
            color: #fff;
            border-color: var(--correct-green);
        }

        button.btn-save {
            background-color: #0284c7;
            color: #fff;
            border-color: #0284c7;
        }

        button.btn-save:hover {
            background-color: #0369a1;
        }

        /* Toggle Switches */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--sub-panel-bg);
            padding: 4px 9px;
            border-radius: 16px;
            border: 1px solid var(--header-border);
            font-size: 0.78rem;
            color: var(--text-main);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--btn-border);
            transition: .3s;
            border-radius: 18px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: #fff;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--correct-green);
        }

        input:checked + .slider:before {
            transform: translateX(16px);
        }

        /* Font Controls */
        .font-controls {
            display: flex;
            align-items: center;
            background-color: var(--sub-panel-bg);
            border-radius: 6px;
            border: 1px solid var(--header-border);
            overflow: hidden;
        }

        .font-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            padding: 4px 8px;
            font-size: 0.92rem;
            border-radius: 0;
        }

        .font-btn:hover {
            background-color: var(--btn-hover);
        }

        /* --- FULL SCREEN GAME PLAY AREA (LADDER ON LEFT, MAIN QUIZ ON RIGHT) --- */
        .game-wrapper {
            flex: 1;
            display: grid;
            grid-template-columns: 215px 1fr;
            gap: 16px;
            padding: 14px 18px;
            min-height: 0;
            overflow-y: auto;
            transition: grid-template-columns 0.3s ease;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        .game-wrapper.hide-ladder {
            grid-template-columns: 0px 1fr;
            gap: 0px;
        }

        .money-ladder {
            order: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--header-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column-reverse;
            justify-content: space-around;
            height: 100%;
            max-height: 100%;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .main-quiz-area {
            order: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 920px;
            margin: auto;
            width: 100%;
            transition: max-width 0.3s ease;
        }

        /* 3 mức độ rộng của main-quiz-area: 0 = chuẩn (920px), 1 = trung gian (1180px), 2 = rộng tối đa (100%) */
        .game-wrapper[data-width-level="1"] .main-quiz-area {
            max-width: 1180px;
        }

        .game-wrapper[data-width-level="2"] .main-quiz-area {
            max-width: 100%;
        }

        /* LIFELINE & KEYWORDS BAR */
        .lifeline-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
            min-height: 36px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mobile-progress-pill {
            display: none;
            background-color: var(--panel-bg);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .keywords-container {
            flex: 1;
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            visibility: hidden;
        }

        .keyword-chip {
            background-color: var(--panel-bg);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 15px;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .keyword-chip:hover {
            background-color: var(--accent-color);
            color: var(--accent-text);
        }

        .btn-5050 {
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            font-size: 0.9rem;
            border-radius: 20px;
            padding: 5px 14px;
            margin-left: auto;
        }

        .btn-5050:hover:not(:disabled) {
            background-color: var(--accent-color);
            color: var(--accent-text);
        }

        .question-box {
            width: 100%;
            background: linear-gradient(180deg, var(--q-bg-top) 0%, var(--q-bg-bottom) 100%);
            border: 2px solid var(--accent-color);
            border-radius: 15px;
            padding: 22px 24px;
            text-align: center;
            font-size: var(--question-size);
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.14);
            transition: font-size 0.2s ease, border-color 0.2s;
            line-height: 1.45;
            word-break: break-word;
            cursor: pointer;
        }

        .question-box:hover {
            filter: brightness(1.03);
        }

        .answers-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .answer-btn {
            background-color: var(--btn-bg);
            border: 1.5px solid var(--btn-border);
            color: var(--text-main);
            padding: 15px 18px;
            border-radius: 32px;
            text-align: left;
            cursor: pointer;
            font-size: var(--answer-size);
            transition: font-size 0.2s ease, background-color 0.2s, border-color 0.2s, transform 0.2s, opacity 0.22s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            line-height: 1.35;
            word-break: break-word;
            white-space: normal;
            min-height: 54px;
        }

        .answer-btn.unrevealed {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            transform: translateY(6px);
        }

        .answer-btn:active:not(:disabled) {
            transform: scale(0.99);
        }

        .answer-text {
            text-align: left;
            flex: 1;
            word-break: break-word;
        }

        .answer-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
            background-color: var(--btn-hover);
        }

        .answer-btn:disabled {
            cursor: default;
            opacity: 1;
        }

        .answer-btn.correct {
            background-color: var(--correct-green) !important;
            border-color: #fff !important;
            color: #fff !important;
        }

        .answer-btn.correct .key-hint {
            background-color: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        .answer-btn.wrong {
            background-color: var(--wrong-red) !important;
            border-color: #fff !important;
            color: #fff !important;
        }

        .answer-btn.wrong .key-hint {
            background-color: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        .answer-btn.hidden-5050 {
            visibility: hidden;
            pointer-events: none;
        }

        .key-hint {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--sub-panel-bg);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 50%;
            width: calc(var(--answer-size) * 1.45);
            height: calc(var(--answer-size) * 1.45);
            min-width: calc(var(--answer-size) * 1.45);
            margin-right: 12px;
            font-weight: bold;
            font-size: calc(var(--answer-size) * 0.85);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .next-btn-container {
            margin-top: 16px;
            min-height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

        /* --- FLOATING TOASTS --- */
        #toastContainer {

            bottom: 38px;
            right: 16px;
            left: 16px;

            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 1000;
            pointer-events: none;

        .toast {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1.5px solid var(--accent-color);

            border-radius: 8px;

        @keyframes fadeIn {

            to { opacity: 1; transform: translateY(0); }

                gap: 5px;

            .btn-wide-toggle {
                display: none;

            .game-wrapper {

            .main-quiz-area {

        @media (max-width: 600px) {

                justify-content: flex-start;
            }

                width: 100%;
                padding: 12px;
            }
        }
    </style>

    function initAudio() {

    function playSound(type) {
        if (isMuted) return;
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'click') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'reveal') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
    }

    document.addEventListener('keydown', function(e) {

            if (e.key === 'Escape') {

            }
            return;
        }

        if (e.key === 'Escape') { closeMobileLadder(); return; }
        if (e.key === '+' || e.key === '=') { changeFontSize(1); return; }
        if (e.key === '-' || e.key === '_') { changeFontSize(-1); return; }
        if (e.key.toLowerCase() === 't') { cycleTheme(); return; }
        if (e.key.toLowerCase() === 'w') { cycleWidthLevel(); return; }
        if (e.key.toLowerCase() === 'm') { toggleMute(); return; }

        if (e.code === 'Space') {
            if (questions.length === 0) return;
            e.preventDefault();
            const state = gameState[currentQuestionIndex];
            if (!isAnsweringBlocked) {
                const currentRevealed = typeof state.revealedCount === 'number' ? state.revealedCount : 0;

        if (isAnsweringBlocked || questions.length === 0) return;

        const key = e.key.toUpperCase();
        if (OPTION_KEYS.includes(key)) {
            checkAnswer(key);
        }
    });

    function cleanQuestionTitle(text) {
        return text.replace(/^(câu|cau)\s*\d+[\.\:\s\-]*/i, '').trim();
    }

    function parseTextToQuestions(rawText) {
        const text = cleanSpecialChars(rawText);
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const parsed = [];
        let currentQ = null;

        lines.forEach(line => {
            if (line.startsWith('#')) {
                if (currentQ) {
                    const contentWithoutHash = line.replace(/^#+/, '').trim();
                    const rawKeywords = contentWithoutHash.split(',');
                    rawKeywords.forEach(kwStr => {
                        let cleanKw = kwStr.replace(/^#+/, '').trim();
                        if (cleanKw) currentQ.keywords.push(cleanKw);
                    });
                }
            } else if (line.match(/^[*]?([A-D])[\.\:\)\s]/i)) {
                if (currentQ) {
                    const isCorrect = line.startsWith('*');
                    const cleanLine = line.replace(/^\*+/, '').trim();
                    const optionKey = cleanLine.charAt(0).toUpperCase();
                    const optionContent = cleanLine.replace(/^[A-D][\.\:\)\s]+/i, '').trim();
                    currentQ.options.push({ text: optionContent, isCorrect: isCorrect, originalKey: optionKey });
                }
            } else {
                if (currentQ && currentQ.options.length === 4) parsed.push(currentQ);
                currentQ = { question: cleanQuestionTitle(line), options: [], keywords: [] };
            }
        });

        if (currentQ && currentQ.options.length === 4) parsed.push(currentQ);
        return parsed;
    }

        const parsedData = parseTextToQuestions(cleanedText);

        if (parsedData.length === 0) {
            showToast('Không tìm thấy câu hỏi hợp lệ!', 'error');
            return;
        }

        questions = parsedData;
        localStorage.setItem('altp_questions_text', cleanedText);
        closeModal('importModal');
        showToast(`Đã nạp thành công ${questions.length} câu hỏi`, 'success');
        startGame();
    }

    function loadDemoData() {
        const parsedData = parseTextToQuestions(defaultDemoText);
        if (parsedData.length > 0) {
            questions = parsedData;
            showToast('Đã nạp bộ câu hỏi Demo!', 'info');
            startGame();
        }
    }

    function startGame() {
        if (questions.length === 0) return;
        currentQuestionIndex = 0;

        gameState = questions.map(q => {
            let opts = q.options;
            if (shuffleAnswers) opts = shuffleArray(opts);

            let currentOptions = {};
            OPTION_KEYS.forEach((key, idx) => {
                currentOptions[key] = opts[idx];
            });

            return {
                optionsLayout: currentOptions,
                revealedCount: 0, // Ban đầu ẩn cả 4 đáp án A, B, C, D; ấn Space hiện lần lượt từng đáp án
                isAnswered: false,
                selectedKey: null,
                isCorrect: null,
                is5050Used: false,
                hiddenKeys5050: [],
                showKeywords: false
            };
        });

        saveFullGameProgress();
        showQuestion();
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function revealNextOption() {
        const state = gameState[currentQuestionIndex];
        if (!state || isAnsweringBlocked) return;
        const currentRevealed = typeof state.revealedCount === 'number' ? state.revealedCount : 0;
        if (currentRevealed >= 4) return;

        state.revealedCount = currentRevealed + 1;
        const key = OPTION_KEYS[state.revealedCount - 1];
        const btn = document.getElementById(`btn${key}`);
        if (btn) {
            btn.classList.remove('unrevealed');
        }
        playSound('click');
        saveFullGameProgress();
    }

    function showQuestion() {
        resetButtonStyles();

        const q = questions[currentQuestionIndex];
        const state = gameState[currentQuestionIndex];

        if (typeof state.revealedCount !== 'number') {
            state.revealedCount = state.isAnswered ? 4 : 0;
        }
        if (state.isAnswered) {
            state.revealedCount = 4;
        }

        document.getElementById('questionText').innerText = `Câu ${currentQuestionIndex + 1}: ${q.question}`;

        const currentMoney = moneyValues[currentQuestionIndex] || `${(currentQuestionIndex + 1) * 10}.000.000`;
        const mobilePill = document.getElementById('mobileProgressPill');
        if (mobilePill) {
            mobilePill.innerText = `🏆 Câu ${currentQuestionIndex + 1}/${questions.length} • ${currentMoney}`;
        }

        OPTION_KEYS.forEach((key, idx) => {
            const btn = document.getElementById(`btn${key}`);
            document.getElementById(`text${key}`).innerText = state.optionsLayout[key].text;
            if (idx >= state.revealedCount) {
                btn.classList.add('unrevealed');
            }
        });

        const btn5050 = document.getElementById('btn5050');
        btn5050.disabled = state.is5050Used;
        if (state.hiddenKeys5050 && state.hiddenKeys5050.length > 0) {
            state.hiddenKeys5050.forEach(key => {
                document.getElementById(`btn${key}`).classList.add('hidden-5050');
            });
        }

        const kwContainer = document.getElementById('keywordsContainer');
        if (state.showKeywords && q.keywords && q.keywords.length > 0) {
            kwContainer.innerHTML = '';
            q.keywords.forEach(kw => {
                const chip = document.createElement('div');
                chip.className = 'keyword-chip';
                chip.innerHTML = `🖼️ ${kw}`;
                chip.title = `Ấn để tìm ảnh "${kw}" trên Google Images`;
                chip.onclick = () => searchImageKeyword(kw);
                kwContainer.appendChild(chip);
            });
            kwContainer.style.visibility = 'visible';
        } else {
            kwContainer.style.visibility = 'hidden';
            kwContainer.innerHTML = '';
        }

        if (state.isAnswered) {
            isAnsweringBlocked = true;

            OPTION_KEYS.forEach(key => {
                document.getElementById(`btn${key}`).disabled = true;
            });

            let correctKey = '';
            OPTION_KEYS.forEach(k => {
                if (state.optionsLayout[k].isCorrect) correctKey = k;
            });

            if (state.selectedKey) {
                if (state.isCorrect) {
                    document.getElementById(`btn${state.selectedKey}`).classList.add('correct');
                } else {
                    document.getElementById(`btn${state.selectedKey}`).classList.add('wrong');
                    if (correctKey) document.getElementById(`btn${correctKey}`).classList.add('correct');
                }
            } else {
                if (correctKey) document.getElementById(`btn${correctKey}`).classList.add('correct');
            }

            document.getElementById('btnNext').style.display = 'block';
        } else {
            isAnsweringBlocked = false;
            document.getElementById('btnNext').style.display = 'none';
        }

        renderLadder();
        const activeLadder = document.getElementById(`ladder-${currentQuestionIndex}`);
        if (activeLadder) {
            activeLadder.classList.add('active');
            activeLadder.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        
        saveFullGameProgress();
    }

    function resetButtonStyles() {
        OPTION_KEYS.forEach(key => {
            const btn = document.getElementById(`btn${key}`);
            btn.className = 'answer-btn';
            btn.disabled = false;
        });
    }

    function use5050() {
        const state = gameState[currentQuestionIndex];
        if (state.is5050Used || isAnsweringBlocked) return;

        // Nếu đang ẩn bớt đáp án thì cho hiện toàn bộ trước khi áp dụng 50:50
        state.revealedCount = 4;
        OPTION_KEYS.forEach(key => {
            document.getElementById(`btn${key}`).classList.remove('unrevealed');
        });

        let wrongKeys = [];
        OPTION_KEYS.forEach(k => {
            if (!state.optionsLayout[k].isCorrect) wrongKeys.push(k);
        });

        wrongKeys = shuffleArray(wrongKeys).slice(0, 2);
        wrongKeys.forEach(key => {
            document.getElementById(`btn${key}`).classList.add('hidden-5050');
        });

        state.is5050Used = true;
        state.hiddenKeys5050 = wrongKeys;
        document.getElementById('btn5050').disabled = true;
        
        saveFullGameProgress();
        playSound('click');
    }

    function checkAnswer(selectedKey) {
        if (isAnsweringBlocked) return;
        isAnsweringBlocked = true;
        playSound('click');

        const state = gameState[currentQuestionIndex];
        const selectedOpt = state.optionsLayout[selectedKey];

        state.revealedCount = 4;
        state.isAnswered = true;
        state.selectedKey = selectedKey;
        state.isCorrect = selectedOpt.isCorrect;
        state.showKeywords = true;

        showQuestion();

        if (state.isCorrect) {
            playSound('correct');
            if (autoNext) {
                setTimeout(() => {
                    nextQuestion();
                }, 1200);
            }
        } else {
            playSound('wrong');
        }
    }

    function revealAnswer() {
        if (isAnsweringBlocked) return;
        isAnsweringBlocked = true;
        playSound('reveal');

        const state = gameState[currentQuestionIndex];
        state.revealedCount = 4;
        state.isAnswered = true;
        state.selectedKey = null;
        state.isCorrect = null;
        state.showKeywords = true;

        showQuestion();
    }

    function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            showQuestion();
        } else {
            showToast('Bạn đã hoàn thành tất cả câu hỏi!', 'success');
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            showQuestion();
        }
    }

    function openSaveModal() {
        const input = document.getElementById('fileNameInput');
        input.value = savedFileName;
        openModal('saveModal');
        setTimeout(() => {
            input.focus();
            input.select();
        }, 100);
    }

    function executeSaveHtml() {
        let nameInput = document.getElementById('fileNameInput').value.trim();
        if (!nameInput) nameInput = "ai-la-trieu-phu";
        savedFileName = nameInput;

        closeModal('saveModal');

        const rawTextData = document.getElementById('importArea').value || defaultDemoText;
        const textData = cleanSpecialChars(rawTextData);
        
        const cloneDoc = document.documentElement.cloneNode(true);

        if (currentTheme === "default") {
            cloneDoc.removeAttribute("data-theme");
        } else {
            cloneDoc.setAttribute("data-theme", currentTheme);
        }

        const clonePattern = cloneDoc.querySelector('#bgPatternLayer');
        if (clonePattern) {
            const resolved = patternMode === "auto"
                ? (defaultPatternByTheme[currentTheme] || "classic")
                : patternMode;
            clonePattern.setAttribute("data-pattern", resolved);
        }

        const safeWallpaper = wallpaperUrl.replace(/"/g, '%22');
        const wallpaperCssVal = wallpaperUrl ? `url("${safeWallpaper}")` : "none";
        const opacityCssVal = (wallpaperOpacity / 100).toFixed(2);
        cloneDoc.style.setProperty("--wallpaper-url", wallpaperCssVal);
        cloneDoc.style.setProperty("--wallpaper-opacity", opacityCssVal);

        const cloneWpInput = cloneDoc.querySelector('#wallpaperUrlInput');
        if (cloneWpInput) cloneWpInput.setAttribute("value", wallpaperUrl);

        const cloneWpRange = cloneDoc.querySelector('#wallpaperOpacityRange');
        if (cloneWpRange) cloneWpRange.setAttribute("value", String(wallpaperOpacity));

        const cloneWpLabel = cloneDoc.querySelector('#wallpaperOpacityLabel');
        if (cloneWpLabel) cloneWpLabel.textContent = `${wallpaperOpacity}%`;

        const cloneWrapper = cloneDoc.querySelector('#gameWrapper');
        if (cloneWrapper) {
            cloneWrapper.setAttribute('data-width-level', String(widthLevel));
        }

        const modals = cloneDoc.querySelectorAll('.modal-overlay');
        modals.forEach(m => m.classList.remove('active'));

        const backdrop = cloneDoc.querySelector('#ladderBackdrop');
        if (backdrop) backdrop.classList.remove('active');

        const ladder = cloneDoc.querySelector('#moneyLadder');
        if (ladder) ladder.classList.remove('mobile-open');

        const importArea = cloneDoc.querySelector('#importArea');
        if (importArea) importArea.textContent = textData;

        let fullHtml = "<!DOCTYPE html>\n" + cloneDoc.outerHTML;

        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${savedFileName}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        showToast(`Đã tải xuống file ${savedFileName}.html!`, 'success');
    }

    renderLadder();
</script>
