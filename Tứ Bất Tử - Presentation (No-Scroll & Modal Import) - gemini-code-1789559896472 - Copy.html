<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tứ Bất Tử - Presentation (No-Scroll & Modal Import)</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-color: #050507;
            --panel-bg: rgba(18, 18, 24, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-primary: #8b5cf6;
            --accent-secondary: #06b6d4;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --font-scale: 1rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Khóa cuộn tuyệt đối cho body và html */
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        /* Ambient background glow */
        .ambient-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(6, 182, 212, 0.05) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(60px);
        }

        /* Main Wrapper fit trong 1 màn hình */
        .app-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            height: 100%;
            max-height: calc(100vh - 20px);
            gap: 10px;
        }

        .presentation-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            aspect-ratio: 16 / 9;
            background: #09090b;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 30px rgba(139, 92, 246, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Scene Management */
        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            padding: 3.5%;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
            align-items: center;
            background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.08), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.05), transparent 50%);
        }

        .scene.active {
            display: grid;
        }

        .scene-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
            min-width: 0;
        }

        .scene-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: calc(0.75rem * var(--font-scale));
            color: #c4b5fd;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            width: fit-content;
        }

        .scene-title {
            font-size: calc(2.2rem * var(--font-scale));
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 30%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .scene-desc {
            font-size: calc(1rem * var(--font-scale));
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .scene-bullets {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .scene-bullets li {
            position: relative;
            padding-left: 18px;
            font-size: calc(0.92rem * var(--font-scale));
            color: #e4e4e7;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .scene-bullets li::before {
            content: '✦';
            color: var(--accent-primary);
            font-size: 0.75rem;
            margin-top: 2px;
        }

        /* Image Frame */
        .scene-media {
            position: relative;
            width: 100%;
            height: 100%;
            max-height: 320px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: rgba(24, 24, 27, 0.5);
        }

        .scene-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Tags */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: calc(0.7rem * var(--font-scale));
            color: var(--accent-secondary);
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .brand, .scene-counter {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* Timeline Progress Bar */
        .timeline-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        .timeline-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transition: width 0.1s linear;
        }

        /* Controls Panel */
        .controls-wrapper {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 10;
            width: 100%;
            flex-shrink: 0;
            padding-bottom: 2px;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--panel-bg);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .btn {
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(39, 39, 42, 0.9);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .btn-primary {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #ffffff;
        }

        .audio-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--panel-bg);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 6px #10b981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Modal Import Styling */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: #121218;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-textarea {
            width: 100%;
            height: 200px;
            background: #09090b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            resize: none;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Responsive cho Mobile: Chuyển bố cục cột dọc gọn gàng không tràn màn hình */
        @media (max-width: 900px) {
            .presentation-container {
                aspect-ratio: auto;
                height: 100%;
            }

            .scene {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 15px;
            }

            .scene.active {
                display: flex;
                flex-direction: column-reverse;
                justify-content: center;
            }

            .scene-media {
                height: 150px;
                max-height: 150px;
            }

            .scene-title {
                font-size: calc(1.4rem * var(--font-scale));
            }

            .controls-wrapper {
                flex-direction: row;
                justify-content: center;
                gap: 6px;
            }

            .btn-group {
                padding: 2px;
            }

            .btn {
                padding: 5px 8px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="app-wrapper">
        <div class="presentation-container" id="presentationContainer">
            <div class="top-bar">
                <div class="brand">TỨ BẤT TỬ</div>
                <div class="scene-counter" id="sceneCounter">01 / 04</div>
            </div>

            <div id="scenesWrapper" style="width: 100%; height: 100%; position: relative;"></div>

            <div class="timeline-container">
                <div class="timeline-progress" id="timelineProgress"></div>
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="btn-group">
                <button class="btn" id="prevBtn">❮ Trước</button>
                <button class="btn btn-primary" id="playPauseBtn">⏸ Dừng</button>
                <button class="btn" id="nextBtn">Sau ❯</button>
            </div>

            <div class="btn-group">
                <button class="btn" id="zoomOutBtn">A-</button>
                <button class="btn" id="zoomResetBtn">Reset</button>
                <button class="btn" id="zoomInBtn">A+</button>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="openModalBtn">📂 Import Dữ Liệu</button>
            </div>

            <div class="audio-status">
                <div class="pulse-dot" id="statusDot"></div>
                <span id="statusText">Trình chiếu</span>
            </div>
        </div>
    </div>

    <!-- Modal Import -->
    <div class="modal-overlay" id="importModal">
        <div class="modal-box">
            <div class="modal-header">
                <span>Nhập dữ liệu Slide (Tab-separated)</span>
                <button class="modal-close" id="closeModalBtn">✕</button>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Dán dữ liệu của bạn vào đây (mỗi dòng là 1 slide, các cột cách nhau bằng phím Tab):</p>
            <textarea class="modal-textarea" id="importDataInput" placeholder="Sơn Tinh	Tản Viên Sơn Thánh...	• Giao diện...	Tản Viên	Ba Vì	Thần thoại	Thiên tai	https://..."></textarea>
            <div class="modal-footer">
                <button class="btn" id="cancelModalBtn">Hủy</button>
                <button class="btn btn-primary" id="confirmImportBtn">Xác nhận Import</button>
            </div>
        </div>
    </div>

    <script>
        // Dữ liệu mẫu chuẩn
        let rawData = [
            ["Sơn Tinh", "Tản Viên Sơn Thánh là vị thần núi tiêu biểu trong Tứ Bất Tử.", "• Còn gọi là Tản Viên Sơn Thánh<br>• Gắn với núi Ba Vì<br>• Biểu tượng chinh phục tự nhiên", "Tản Viên", "Ba Vì", "Thần thoại", "Thiên tai", "https://phuday.com/wp-content/uploads/2021/11/duc-tan-vien-son-thanh-la-ai-2.jpg"],
            ["Thánh Gióng", "Phù Đổng Thiên Vương là biểu tượng chống giặc ngoại xâm.", "• Còn gọi là Phù Đổng Thiên Vương<br>• Đánh giặc Ân<br>• Bay về trời sau chiến thắng", "Phù Đổng", "Anh hùng", "Ngoại xâm", "Lịch sử", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcVStxR3AbbnR1Ev1ZAdWy_JdBa0G1HWmf3KAyoMs-fbKGfEHynjKxp1sb&s=10"]
        ];

        let currentIndex = 0;
        let isPlaying = true;
        let synth = window.speechSynthesis;
        let currentUtterance = null;
        let progressInterval = null;
        let fontScaleFactor = 1.0;

        const scenesWrapper = document.getElementById('scenesWrapper');
        const sceneCounter = document.getElementById('sceneCounter');
        const timelineProgress = document.getElementById('timelineProgress');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        
        // Modal elements
        const importModal = document.getElementById('importModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const confirmImportBtn = document.getElementById('confirmImportBtn');
        const importDataInput = document.getElementById('importDataInput');

        function renderScenes(data) {
            scenesWrapper.innerHTML = '';
            data.forEach((item, index) => {
                const title = item[0] || '';
                const desc = item[1] || '';
                const bulletsRaw = item[2] || '';
                
                let bulletsHtml = bulletsRaw.includes('<br>') 
                    ? bulletsRaw.split('<br>').map(b => `<li>${b.replace(/^[•\-\*]\s*/, '')}</li>`).join('')
                    : `<li>${bulletsRaw}</li>`;

                const tags = [item[3], item[4], item[5], item[6]].filter(Boolean);
                const imgSrc = item[7] || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800';
                const scriptText = `${title}: ${desc} ${tags.join('. ')}`;

                const sceneDiv = document.createElement('div');
                sceneDiv.className = `scene ${index === 0 ? 'active' : ''}`;
                sceneDiv.setAttribute('data-script', scriptText);

                sceneDiv.innerHTML = `
                    <div class="scene-content">
                        <div class="scene-badge">Slide ${index + 1} // ${title}</div>
                        <h2 class="scene-title">${title}</h2>
                        <p class="scene-desc">${desc}</p>
                        <ul class="scene-bullets">${bulletsHtml}</ul>
                        <div class="tags-container">
                            ${tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                    </div>
                    <div class="scene-media">
                        <img src="${imgSrc}" alt="${title}" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800'">
                    </div>
                `;
                scenesWrapper.appendChild(sceneDiv);
            });
        }

        function getScenes() {
            return document.querySelectorAll('.scene');
        }

        function animateSceneIn(sceneElement) {
            const elements = sceneElement.querySelectorAll('.scene-badge, .scene-title, .scene-desc, .scene-bullets li, .tag, .scene-media');
            gsap.set(elements, { clearProps: "all" });

            gsap.timeline()
              .fromTo(sceneElement.querySelector('.scene-badge'), { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25 })
              .fromTo(sceneElement.querySelector('.scene-title'), { y: 15, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3 }, "-=0.1")
              .fromTo(sceneElement.querySelector('.scene-desc'), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25 }, "-=0.15")
              .fromTo(sceneElement.querySelectorAll('.scene-bullets li'), { x: -10, opacity: 0 }, { x: 0, opacity: 1, duration: 0.2, stagger: 0.05 }, "-=0.1")
              .fromTo(sceneElement.querySelector('.scene-media'), { scale: 0.98, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3 }, "-=0.15");
        }

        function stopSpeech() {
            if (synth.speaking || synth.pending) synth.cancel();
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function playScene(index) {
            stopSpeech();
            const scenes = getScenes();
            if (scenes.length === 0) return;

            currentIndex = (index + scenes.length) % scenes.length;

            scenes.forEach(s => s.classList.remove('active'));
            const currentScene = scenes[currentIndex];
            currentScene.classList.add('active');

            sceneCounter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(scenes.length).padStart(2, '0')}`;
            animateSceneIn(currentScene);

            if (!isPlaying) {
                timelineProgress.style.width = '0%';
                statusText.textContent = 'Đã dừng';
                statusDot.style.backgroundColor = '#f59e0b';
                statusDot.style.boxShadow = '0 0 6px #f59e0b';
                return;
            }

            statusText.textContent = 'Đang đọc...';
            statusDot.style.backgroundColor = '#10b981';
            statusDot.style.boxShadow = '0 0 6px #10b981';

            const scriptText = currentScene.getAttribute('data-script');
            currentUtterance = new SpeechSynthesisUtterance(scriptText);
            currentUtterance.lang = 'vi-VN';
            currentUtterance.rate = 1.0;

            const estimatedDuration = Math.max(3000, (scriptText.length / 13) * 1000);
            const startTime = Date.now();
            timelineProgress.style.width = '0%';

            progressInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let pct = Math.min(100, (elapsed / estimatedDuration) * 100);
                timelineProgress.style.width = pct + '%';
            }, 50);

            currentUtterance.onend = () => {
                if (progressInterval) clearInterval(progressInterval);
                timelineProgress.style.width = '100%';
                if (isPlaying) playScene(currentIndex + 1);
            };

            currentUtterance.onerror = () => {
                if (progressInterval) clearInterval(progressInterval);
                if (isPlaying) setTimeout(() => playScene(currentIndex + 1), 1500);
            };

            synth.speak(currentUtterance);
        }

        // Font scaling
        function updateFontScale(delta) {
            fontScaleFactor = Math.min(1.2, Math.max(0.8, fontScaleFactor + delta));
            document.documentElement.style.setProperty('--font-scale', fontScaleFactor);
        }

        document.getElementById('zoomInBtn').addEventListener('click', () => updateFontScale(0.08));
        document.getElementById('zoomOutBtn').addEventListener('click', () => updateFontScale(-0.08));
        document.getElementById('zoomResetBtn').addEventListener('click', () => {
            fontScaleFactor = 1.0;
            document.documentElement.style.setProperty('--font-scale', fontScaleFactor);
        });

        // Controls binding
        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playPauseBtn.innerHTML = '⏸ Dừng';
                playScene(currentIndex);
            } else {
                playPauseBtn.innerHTML = '▶ Tiếp tục';
                stopSpeech();
                statusText.textContent = 'Đã dừng';
                statusDot.style.backgroundColor = '#f59e0b';
                statusDot.style.boxShadow = '0 0 6px #f59e0b';
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => playScene(currentIndex + 1));
        document.getElementById('prevBtn').addEventListener('click', () => playScene(currentIndex - 1));

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') playScene(currentIndex + 1);
            if (e.key === 'ArrowLeft') playScene(currentIndex - 1);
        });

        // Modal Logic
        openModalBtn.addEventListener('click', () => importModal.classList.add('open'));
        closeModalBtn.addEventListener('click', () => importModal.classList.remove('open'));
        cancelModalBtn.addEventListener('click', () => importModal.classList.remove('open'));

        confirmImportBtn.addEventListener('click', () => {
            const textContent = importDataInput.value.trim();
            if (!textContent) {
                alert('Vui lòng nhập nội dung dữ liệu!');
                return;
            }

            try {
                const lines = textContent.split('\n');
                const parsedData = lines.map(line => {
                    if (!line.trim()) return null;
                    return line.split('\t').map(cell => cell.trim());
                }).filter(item => item && item.length >= 2);

                if (parsedData.length > 0) {
                    rawData = parsedData;
                    renderScenes(rawData);
                    currentIndex = 0;
                    playScene(currentIndex);
                    importModal.classList.remove('open');
                    importDataInput.value = '';
                    alert(`Đã cập nhật thành công ${rawData.length} slide!`);
                } else {
                    alert('Cấu trúc dữ liệu không hợp lệ. Hãy đảm bảo các cột cách nhau bằng phím Tab.');
                }
            } catch (err) {
                alert('Lỗi xử lý dữ liệu: ' + err.message);
            }
        });

        // Khởi tạo chạy lần đầu
        renderScenes(rawData);
        window.addEventListener('load', () => setTimeout(() => playScene(0), 300));
    </script>
</body>
</html>
