<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Speed Dash - Nâng Cấp</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud-panel {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        /* Màn hình Menu cài đặt */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        .menu-box {
            background: #222;
            padding: 30px 40px;
            border-radius: 12px;
            border: 2px solid #ffeb3b;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .menu-box h1 {
            margin-top: 0;
            color: #ffeb3b;
        }
        .setting-group {
            margin: 20px 0;
            text-align: left;
        }
        .setting-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #ccc;
        }
        select {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 1rem;
        }
        .btn-start {
            background: #ffeb3b;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-start:hover {
            background: #fdd835;
        }
        #controls-prompt {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2rem;
            pointer-events: auto;
            border: 2px solid #ffeb3b;
        }
        .highlight {
            color: #ffeb3b;
            font-weight: bold;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu-screen">
        <div class="menu-box">
            <h1>3D SPEED DASH</h1>
            <div class="setting-group">
                <label for="distance-select">Chọn cự li thi đấu:</label>
                <select id="distance-select">
                    <option value="60">60 Mét (Nước rút ngắn)</option>
                    <option value="100" selected>100 Mét (Tiêu chuẩn)</option>
                    <option value="200">200 Mét (Đường dài)</option>
                </select>
            </div>
            <div class="setting-group">
                <label for="difficulty-select">Chọn độ khó:</label>
                <select id="difficulty-select">
                    <option value="easy">Dễ (Bot chạy chậm)</option>
                    <option value="medium" selected>Trung bình</option>
                    <option value="hard">Khó (Bot nước rút mạnh)</option>
                </select>
            </div>
            <button class="btn-start" onclick="startGameFromMenu()">BẮT ĐẦU ĐUA</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-panel">
            <div>Khoảng cách: <span id="distance" class="highlight">0.0</span>m / <span id="max-distance-label">100</span>m</div>
            <div>Trạng thái: <span id="status" class="highlight">Chờ xuất phát</span></div>
        </div>

        <div id="controls-prompt">
            NHẤN LIÊN TỤC <span class="highlight">[SPACE]</span> HOẶC <span class="highlight">[CHẠM]</span> ĐỂ CHẠY! (Không giữ phím)
        </div>
    </div>

    <script>
        let TRACK_LENGTH_M = 100;
        const TOTAL_RUNNERS = 11;
        const LANE_WIDTH = 1.2;

        let gameStarted = false;
        let gameOver = false;
        let playerDistance = 0;
        let playerSpeed = 0;
        let difficulty = 'medium';

        // Biến chống giữ phím: yêu cầu nhả hẳn phím ra mới được bấm tiếp
        let keyReleased = true;

        let runners = [];
        let scene, camera, renderer;
        
        const distanceEl = document.getElementById('distance');
        const maxDistanceLabel = document.getElementById('max-distance-label');
        const statusEl = document.getElementById('status');
        const promptEl = document.getElementById('controls-prompt');
        const menuScreen = document.getElementById('menu-screen');

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 40, 160);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createTrack();
            createRunners();
            updateCameraPosition(0);

            window.addEventListener('resize', onWindowResize);
        }

        function createTrack() {
            const trackTotalLen = TRACK_LENGTH_M + 20;
            const grassGeo = new THREE.PlaneGeometry(200, trackTotalLen);
            const grassMat = new THREE.MeshLambertMaterial({ color: 0x3a9d23 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI / 2;
            grass.position.set(0, -0.05, TRACK_LENGTH_M / 2);
            scene.add(grass);

            const trackWidth = TOTAL_RUNNERS * LANE_WIDTH + 1;
            const trackGeo = new THREE.PlaneGeometry(trackWidth, trackTotalLen);
            const trackMat = new THREE.MeshLambertMaterial({ color: 0xb54527 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            track.position.set(0, 0, TRACK_LENGTH_M / 2);
            scene.add(track);

            for (let i = 0; i <= TOTAL_RUNNERS; i++) {
                const lineX = -trackWidth / 2 + i * LANE_WIDTH;
                const lineGeo = new THREE.PlaneGeometry(0.08, trackTotalLen);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(lineX, 0.01, TRACK_LENGTH_M / 2);
                scene.add(line);
            }

            // Vạch đích
            for (let i = 0; i < TOTAL_RUNNERS; i++) {
                const lineX = -trackWidth / 2 + i * LANE_WIDTH + LANE_WIDTH / 2;
                const finishGeo = new THREE.PlaneGeometry(LANE_WIDTH, 1);
                const finishMat = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
                const finish = new THREE.Mesh(finishGeo, finishMat);
                finish.rotation.x = -Math.PI / 2;
                finish.position.set(lineX, 0.02, TRACK_LENGTH_M);
                scene.add(finish);
            }
        }

        // Tạo nhân vật có đầy đủ tay chân cử động
        function createRunnerMesh(colorHex) {
            const group = new THREE.Group();

            // Thân người
            const bodyGeo = new THREE.CylinderGeometry(0.2, 0.15, 0.7, 8);
            const bodyMat = new THREE.MeshLambertMaterial({ color: colorHex });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.55;
            body.castShadow = true;
            group.add(body);

            // Đầu
            const headGeo = new THREE.SphereGeometry(0.18, 8, 8);
            const headMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.05;
            group.add(head);

            // Tay trái
            const armGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.6, 6);
            const limbsMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            
            const leftArm = new THREE.Mesh(armGeo, limbsMat);
            leftArm.position.set(-0.3, 0.6, 0);
            leftArm.geometry.translate(0, -0.3, 0); // Đổi trục xoay về khớp vai
            group.add(leftArm);

            // Tay phải
            const rightArm = new THREE.Mesh(armGeo, limbsMat);
            rightArm.position.set(0.3, 0.6, 0);
            rightArm.geometry.translate(0, -0.3, 0);
            group.add(rightArm);

            // Chân trái
            const leftLeg = new THREE.Mesh(armGeo, limbsMat);
            leftLeg.position.set(-0.12, 0.25, 0);
            leftLeg.geometry.translate(0, -0.3, 0);
            group.add(leftLeg);

            // Chân phải
            const rightLeg = new THREE.Mesh(armGeo, limbsMat);
            rightLeg.position.set(0.12, 0.25, 0);
            rightLeg.geometry.translate(0, -0.3, 0);
            group.add(rightLeg);

            // Trả về object lưu trữ các bộ phận để animate cử động
            return {
                group,
                leftArm,
                rightArm,
                leftLeg,
                rightLeg
            };
        }

        function createRunners() {
            // Xóa runner cũ nếu có
            runners.forEach(r => scene.remove(r.meshData.group));
            runners = [];

            const trackWidth = TOTAL_RUNNERS * LANE_WIDTH;
            const colors = [
                0x00bcd4, 0xe91e63, 0x9c27b0, 0x673ab7, 0x3f51b5, 
                0x009688, 0x4caf50, 0xff9800, 0x795548, 0x607d8b, 0xff5722
            ];

            let botBaseSpeed = 8.5;
            if (difficulty === 'easy') botBaseSpeed = 7.5;
            if (difficulty === 'hard') botBaseSpeed = 9.2;

            for (let i = 0; i < TOTAL_RUNNERS; i++) {
                const laneX = -trackWidth / 2 + i * LANE_WIDTH + LANE_WIDTH / 2;
                const meshData = createRunnerMesh(colors[i]);
                meshData.group.position.set(laneX, 0, 0);
                scene.add(meshData.group);

                runners.push({
                    id: i,
                    isPlayer: (i === 0),
                    meshData: meshData,
                    distance: 0,
                    maxSpeed: i === 0 ? 0 : botBaseSpeed + Math.random() * 1.5,
                    speed: 0
                });
            }
        }

        function updateCameraPosition(playerDist) {
            camera.position.set(0, 3.2, playerDist - 5.2);
            camera.lookAt(0, 1.0, playerDist + 7);
        }

        function startGameFromMenu() {
            TRACK_LENGTH_M = parseInt(document.getElementById('distance-select').value);
            difficulty = document.getElementById('difficulty-select').value;
            
            maxDistanceLabel.textContent = TRACK_LENGTH_M;
            menuScreen.style.display = 'none';

            // Khởi tạo lại đường đua và nhân vật theo cự li và độ khó mới
            createTrack();
            createRunners();
            resetGameState();
        }

        // Xử lý sự kiện nhấn phím chạy (Mỗi lần nhấn tính là 1 nhịp)
        function triggerRunningAction() {
            if (menuScreen.style.display !== 'none') return;

            if (gameOver) {
                // Đã về đích: Không dùng phím Space chạy để reset nữa, phải bấm phím R hoặc chơi lại từ menu
                return;
            }

            // Chống giữ phím: Nếu người chơi đang đè giữ phím xuống, lệnh này sẽ bị bỏ qua cho đến khi nhả ra
            if (!keyReleased) return;
            keyReleased = false;

            if (!gameStarted) {
                gameStarted = true;
                statusEl.textContent = "Đang chạy nước rút...";
                promptEl.textContent = "LIÊN TỤC NHẤN ĐỂ TĂNG TỐC! (Đừng giữ phím)";
            }

            playerSpeed += 1.6;
            if (playerSpeed > 11.5) playerSpeed = 11.5;
        }

        function releaseRunningAction() {
            keyReleased = true; // Cho phép nhận cú nhấp tiếp theo
        }

        // Sự kiện bàn phím PC
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerRunningAction();
            }
            // Phím R độc lập để chơi lại khi đã về đích
            if (e.code === 'KeyR' && gameOver) {
                menuScreen.style.display = 'flex';
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                releaseRunningAction();
            }
        });

        // Sự kiện chạm màn hình di động
        window.addEventListener('pointerdown', (e) => {
            // Tránh bấm nhầm vào menu select
            if (e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON') return;
            triggerRunningAction();
        });

        window.addEventListener('pointerup', (e) => {
            releaseRunningAction();
        });

        let lastTime = performance.now();

        function animate(currentTime) {
            requestAnimationFrame(animate);

            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (gameStarted && !gameOver) {
                // 1. Cập nhật người chơi
                playerSpeed -= 3.2 * deltaTime;
                if (playerSpeed < 0) playerSpeed = 0;

                playerDistance += playerSpeed * deltaTime;
                if (playerDistance > TRACK_LENGTH_M) playerDistance = TRACK_LENGTH_M;

                const player = runners[0];
                player.distance = playerDistance;
                player.meshData.group.position.z = playerDistance;

                // Cử động tay chân nhân vật dựa theo tốc độ
                animateLimbs(player.meshData, playerSpeed, currentTime);

                distanceEl.textContent = playerDistance.toFixed(1);
                updateCameraPosition(playerDistance);

                // 2. Cập nhật các Bot
                let finishedCount = 0;
                for (let i = 1; i < runners.length; i++) {
                    let bot = runners[i];
                    if (bot.distance < TRACK_LENGTH_M) {
                        let targetSpeed = bot.maxSpeed + Math.sin(currentTime * 0.005 + i) * 0.4;
                        if (bot.distance > TRACK_LENGTH_M * 0.85) targetSpeed *= 1.08; // Nước rút cuối

                        bot.distance += targetSpeed * deltaTime;
                        if (bot.distance > TRACK_LENGTH_M) bot.distance = TRACK_LENGTH_M;

                        bot.meshData.group.position.z = bot.distance;
                        animateLimbs(bot.meshData, targetSpeed, currentTime);
                    }

                    if (bot.distance >= TRACK_LENGTH_M) finishedCount++;
                }

                // 3. Kiểm tra kết thúc
                if (playerDistance >= TRACK_LENGTH_M || finishedCount === runners.length - 1) {
                    gameOver = true;
                    checkRanking();
                }
            }

            renderer.render(scene, camera);
        }

        // Hàm tạo cử động vung tay múa chân luân phiên khi chạy
        function animateLimbs(meshData, speed, time) {
            if (speed < 0.1) {
                // Đứng yên
                meshData.leftArm.rotation.x = 0;
                meshData.rightArm.rotation.x = 0;
                meshData.leftLeg.rotation.x = 0;
                meshData.rightLeg.rotation.x = 0;
                meshData.group.position.y = 0;
                return;
            }

            const swingAngle = Math.sin(time * 0.025 * speed) * 0.8;
            meshData.leftArm.rotation.x = swingAngle;
            meshData.rightArm.rotation.x = -swingAngle;
            meshData.leftLeg.rotation.x = -swingAngle;
            meshData.rightLeg.rotation.x = swingAngle;

            // Nhún nhảy nhẹ theo nhịp bước chân
            meshData.group.position.y = Math.abs(Math.sin(time * 0.025 * speed * 2)) * 0.12;
        }

        function checkRanking() {
            let sorted = [...runners].sort((a, b) => b.distance - a.distance);
            let rank = sorted.findIndex(r => r.isPlayer) + 1;

            if (rank === 1) {
                statusEl.textContent = "🏆 VÔ ĐỊCH (Hạng 1)! Xuất sắc!";
            } else if (rank <= 3) {
                statusEl.textContent = `🥉 Đạt Hạng ${rank}! Rất cố gắng!`;
            } else {
                statusEl.textContent = `😢 Về đích ở Hạng ${rank}. Thử lại nhé!`;
            }
            promptEl.textContent = "VỀ ĐÍCH! NHẤN [R] HOẶC MỞ MENU ĐỂ CHƠI LẠI";
        }

        function resetGameState() {
            gameStarted = false;
            gameOver = false;
            playerDistance = 0;
            playerSpeed = 0;
            keyReleased = true;
            lastTime = performance.now();

            statusEl.textContent = "Chờ xuất phát";
            distanceEl.textContent = "0.0";
            promptEl.innerHTML = 'NHẤN LIÊN TỤC <span class="highlight">[SPACE]</span> HOẶC <span class="highlight">[CHẠM]</span> ĐỂ CHẠY! (Không giữ phím)';

            runners.forEach((r, i) => {
                r.distance = 0;
                r.meshData.group.position.z = 0;
                r.meshData.group.position.y = 0;
                if (!r.isPlayer) {
                    let base = (difficulty === 'easy') ? 7.5 : (difficulty === 'hard' ? 9.2 : 8.5);
                    r.maxSpeed = base + Math.random() * 1.5;
                }
            });

            updateCameraPosition(0);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Khởi động Three.js engine sẵn sàng
        initThree();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
