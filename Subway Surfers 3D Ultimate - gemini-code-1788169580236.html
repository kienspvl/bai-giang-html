<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Surfers 3D Ultimate</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Ngăn chặn cuộn trang mặc định trên mobile */
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            display: none;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255,0,0,0.7);
            z-index: 10;
        }
        #game-over h1 {
            margin-top: 0;
            color: #ff4757;
            font-size: 38px;
        }
        #restart-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #restart-btn:hover {
            background-color: #26af5f;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #ddd;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

    <div id="ui">
        Điểm: <span id="score">0</span><br>
        💰 Đồng xu: <span id="coins">0</span>
    </div>
    
    <div id="game-over">
        <h1>GAME OVER</h1>
        <p>Điểm cuối: <span id="final-score">0</span></p>
        <p>Đồng xu thu thập: <span id="final-coins">0</span></p>
        <br>
        <button id="restart-btn" onclick="resetGame()">Chơi Lại</button>
    </div>

    <div id="instructions">
        <b>PC</b>: Mũi tên Trái/Phải/Lên/Xuống | <b>Mobile</b>: Vuốt để điều khiển
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, player;
        let obstacles = [];
        let coins = [];
        let score = 0;
        let coinCount = 0;
        let isGameOver = false;
        
        // Cố định tốc độ đều đặn, tăng dần tuyến tính theo thời gian thực
        let gameSpeed = 22; // Đơn vị: mét / giây
        const baseSpeed = 22;
        
        const lanes = [-2.5, 0, 2.5];
        let currentLane = 1;
        
        let isJumping = false;
        let isDucking = false;
        let jumpVelocity = 0;
        const gravity = 25; // Gia tốc trọng trường chuẩn theo giây
        let duckTimer = 0;

        // Biến quản lý thời gian để tốc độ game luôn đồng đều độc lập với FPS
        let clock = new THREE.Clock();
        let spawnTimerObs = 0;
        let spawnTimerCoin = 0;

        // --- HỆ THỐNG ÂM THANH & NHẠC NỀN (Web Audio API) ---
        let audioCtx;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            startBGM();
        }

        // Phát nhạc nền vòng lặp (Chiptune style đơn giản)
        function startBGM() {
            if (bgmInterval) return;
            const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 392.00, 329.63, 293.66];
            let noteIndex = 0;

            bgmInterval = setInterval(() => {
                if (isGameOver || !audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);
                    
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);

                    noteIndex = (noteIndex + 1) % notes.length;
                } catch(e) {}
            }, 250);
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1400, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'jump') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.exponentialRampToValueAtTime(550, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.linearRampToValueAtTime(30, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch(e) {}
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 15, 80);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 8.5);
            camera.lookAt(0, 0, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Ánh sáng
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 25, 10);
            scene.add(dirLight);

            createTrack();

            // Tạo nhân vật
            player = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3498db });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.position.y = 0.6;
            player.add(bodyMesh);
            player.position.set(lanes[currentLane], 0, 0);
            scene.add(player);

            // Sự kiện bàn phím
            window.addEventListener('keydown', (e) => {
                initAudio();
                handleKeyDown(e);
            });

            // Sự kiện cảm ứng vuốt màn hình (Touch Controls)
            let touchStartX = 0;
            let touchStartY = 0;
            window.addEventListener('touchstart', (e) => {
                initAudio();
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, {passive: false});

            window.addEventListener('touchend', (e) => {
                if (isGameOver) return;
                let touchEndX = e.changedTouches[0].clientX;
                let touchEndY = e.changedTouches[0].clientY;
                let diffX = touchEndX - touchStartX;
                let diffY = touchEndY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    // Vuốt ngang
                    if (diffX > 40 && currentLane < 2) currentLane++;
                    else if (diffX < -40 && currentLane > 0) currentLane--;
                } else {
                    // Vuốt dọc
                    if (diffY < -40 && !isJumping && !isDucking) {
                        // Vuốt lên -> Nhảy
                        isJumping = true;
                        jumpVelocity = 10;
                        playSound('jump');
                    } else if (diffY > 40 && !isJumping && !isDucking) {
                        // Vuốt xuống -> Cúi
                        isDucking = true;
                        duckTimer = 0.5; // thời gian cúi (giây)
                        player.scale.set(1, 0.5, 1);
                        player.position.y = 0;
                    }
                }
            }, {passive: false});

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createTrack() {
            const trackGeo = new THREE.PlaneGeometry(8, 140);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x2f3640 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            track.position.set(0, 0, -60);
            scene.add(track);

            for (let i = -1; i <= 1; i += 2) {
                const lineGeo = new THREE.PlaneGeometry(0.12, 140);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i * 1.25, 0.01, -60);
                scene.add(line);
            }
        }

        function spawnObstacle() {
            const type = Math.floor(Math.random() * 3); 
            const randomLane = Math.floor(Math.random() * 3);
            const obstacleGroup = new THREE.Group();

            if (type === 0) {
                const obsGeo = new THREE.BoxGeometry(1.2, 0.9, 0.4);
                const obsMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
                const mesh = new THREE.Mesh(obsGeo, obsMat);
                mesh.position.y = 0.45;
                obstacleGroup.add(mesh);
                obstacleGroup.userData = { type: 'low' };
            } else if (type === 1) {
                const poleGeo = new THREE.BoxGeometry(0.2, 2.2, 0.2);
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
                const p1 = new THREE.Mesh(poleGeo, poleMat); p1.position.set(-0.6, 1.1, 0);
                const p2 = new THREE.Mesh(poleGeo, poleMat); p2.position.set(0.6, 1.1, 0);
                const topGeo = new THREE.BoxGeometry(1.4, 0.4, 0.4);
                const topMat = new THREE.MeshStandardMaterial({ color: 0xc0392b });
                const top = new THREE.Mesh(topGeo, topMat);
                top.position.set(0, 2.0, 0);
                obstacleGroup.add(p1, p2, top);
                obstacleGroup.userData = { type: 'high' };
            } else {
                const rampGeo = new THREE.BoxGeometry(1.2, 0.4, 1.5);
                const rampMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71 });
                const mesh = new THREE.Mesh(rampGeo, rampMat);
                mesh.rotation.x = -0.3;
                mesh.position.y = 0.2;
                obstacleGroup.add(mesh);
                obstacleGroup.userData = { type: 'ramp' };
            }

            obstacleGroup.position.set(lanes[randomLane], 0, -65);
            scene.add(obstacleGroup);
            obstacles.push(obstacleGroup);
        }

        function spawnCoins() {
            const randomLane = Math.floor(Math.random() * 3);
            const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.8, roughness: 0.2 });
            
            for (let i = 0; i < 4; i++) {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.z = Math.PI / 2;
                coin.position.set(lanes[randomLane], 0.6, -65 - (i * 1.5));
                scene.add(coin);
                coins.push(coin);
            }
        }

        function handleKeyDown(e) {
            if (isGameOver) return;

            if (e.key === 'ArrowLeft' && currentLane > 0) {
                currentLane--;
            } else if (e.key === 'ArrowRight' && currentLane < 2) {
                currentLane++;
            } else if (e.key === 'ArrowUp' && !isJumping && !isDucking) {
                isJumping = true;
                jumpVelocity = 10;
                playSound('jump');
            } else if (e.key === 'ArrowDown' && !isJumping && !isDucking) {
                isDucking = true;
                duckTimer = 0.5;
                player.scale.set(1, 0.5, 1);
                player.position.y = 0;
            }
        }

        function updateGame() {
            if (isGameOver) return;

            // Tính thời gian trôi qua giữa các khung hình (delta time) để game siêu mượt, không bị giật cục hay lúc nhanh lúc chậm
            let delta = clock.getDelta();

            // Tăng tốc độ game đều đặn theo thời gian thực (giới hạn tối đa 42 m/s)
            if (gameSpeed < 42) {
                gameSpeed += delta * 0.4;
            }

            // Cập nhật điểm số dựa theo quãng đường di chuyển thực tế
            score += Math.floor(gameSpeed * delta * 2);
            document.getElementById('score').innerText = score;

            // Quản lý thời gian sinh vật cản và tiền vàng đều đặn theo giây
            spawnTimerObs += delta;
            if (spawnTimerObs > (1.5 - (gameSpeed - baseSpeed) * 0.02)) {
                spawnObstacle();
                spawnTimerObs = 0;
            }

            spawnTimerCoin += delta;
            if (spawnTimerCoin > 1.2) {
                spawnCoins();
                spawnTimerCoin = 0;
            }

            // Di chuyển làn mượt mà độc lập khung hình
            const targetX = lanes[currentLane];
            player.position.x += (targetX - player.position.x) * (delta * 15);

            // Xử lý nhảy chuẩn vật lý thời gian thực
            if (isJumping) {
                player.position.y += jumpVelocity * delta;
                jumpVelocity -= gravity * delta;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumping = false;
                }
            }

            // Xử lý cúi đầu theo giây
            if (isDucking) {
                duckTimer -= delta;
                if (duckTimer <= 0) {
                    isDucking = false;
                    player.scale.set(1, 1, 1);
                }
            }

            // Cập nhật chướng ngại vật
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += gameSpeed * delta;

                // Kiểm tra va chạm AABB chính xác
                if (Math.abs(player.position.x - obs.position.x) < 0.6 && Math.abs(obs.position.z) < 0.5) {
                    let data = obs.userData;
                    if (data.type === 'low') {
                        if (player.position.y < 0.7) { triggerGameOver(); }
                    } else if (data.type === 'high') {
                        if (!isDucking || player.position.y >= 0.4) { triggerGameOver(); }
                    } else if (data.type === 'ramp') {
                        isJumping = true;
                        jumpVelocity = 12; // Nhảy siêu cao khi qua dốc
                        playSound('jump');
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        continue;
                    }
                }

                if (obs.position.z > 6) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // Cập nhật đồng xu
            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                c.rotation.x += delta * 4;
                c.position.z += gameSpeed * delta;

                if (Math.abs(player.position.x - c.position.x) < 0.6 && 
                    Math.abs(player.position.z - c.position.z) < 0.6 && 
                    player.position.y < 1.2) {
                    scene.remove(c);
                    coins.splice(i, 1);
                    coinCount++;
                    score += 50;
                    document.getElementById('coins').innerText = coinCount;
                    playSound('coin');
                    continue;
                }

                if (c.position.z > 6) {
                    scene.remove(c);
                    coins.splice(i, 1);
                }
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            playSound('hit');
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-coins').innerText = coinCount;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            coins.forEach(c => scene.remove(c));
            obstacles = [];
            coins = [];

            score = 0;
            coinCount = 0;
            gameSpeed = baseSpeed;
            currentLane = 1;
            isJumping = false;
            isDucking = false;
            spawnTimerObs = 0;
            spawnTimerCoin = 0;
            clock = new THREE.Clock(); // Reset đồng hồ thời gian

            player.scale.set(1, 1, 1);
            player.position.set(lanes[currentLane], 0, 0);

            document.getElementById('score').innerText = score;
            document.getElementById('coins').innerText = coinCount;
            document.getElementById('game-over').style.display = 'none';
            isGameOver = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
