<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Trình Chiếu Tự Động - Tứ Bất Tử</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1100px;
            height: 75vh;
            max-height: 650px;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .image-box {
            flex: 1;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            min-height: 250px;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: zoomEffect 10s infinite alternate;
        }

        @keyframes zoomEffect {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .content-box {
            flex: 1.2;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #ffd700;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 8px;
        }

        .desc {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .bullets {
            font-size: 1rem;
            line-height: 1.5;
            color: #ddd;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            border-radius: 10px;
            border-left: 4px solid #ffd700;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        button {
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #ffd700;
            color: #000;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        button:hover {
            background: #ffea75;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                max-height: none;
            }
            .image-box {
                height: 250px;
                flex: none;
            }
            .content-box {
                padding: 20px;
                flex: none;
            }
            h1 {
                font-size: 1.6rem;
            }
            .desc {
                font-size: 1.05rem;
            }
            .bullets {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-box">
            <img id="slide-img" src="" alt="Hình ảnh minh họa" onerror="this.src='https://via.placeholder.com/600x400?text=Khong+Tai+Duoc+Anh'">
        </div>
        <div class="content-box">
            <h1 id="slide-title">Đang tải...</h1>
            <div class="desc" id="slide-desc"></div>
            <div class="bullets" id="slide-bullets"></div>
        </div>
    </div>

    <div class="controls">
        <button id="playPauseBtn" onclick="togglePlay()">Tạm dừng</button>
        <button onclick="nextSlide()">Chuyển tiếp</button>
    </div>

            {
                title: "Ý nghĩa Chử Đồng Tử",
                fullText: "Ý nghĩa Chử Đồng Tử. Chử Đồng Tử đại diện cho lao động, phồn vinh và đạo lý báo hiếu. Gồm các giá trị: Báo hiếu cha, kết hôn với Tiên Dung, khai phá và phát triển cộng đồng.",
                desc: "Chử Đồng Tử đại diện cho lao động, phồn vinh và đạo lý báo hiếu.",
                bullets: "• Báo hiếu cha<br>• Kết hôn với Tiên Dung<br>• Khai phá và phát triển cộng đồng",
                img: "https://media.tapchinghiencuuphathoc.vn/uploads/2024/12/10/chu-dong-tu-tien-dung-7-1733821941.jpg"
            }
        ];

        let currentIndex = 0;
        let isPlaying = true;
        let synth = window.speechSynthesis;
        let globalUtterance = null; // Biến toàn cục cố định chống Garbage Collection
        let slideTimeout = null;

        function updateSlide() {
            if (currentIndex >= data.length) {
                currentIndex = 0; // Quay vòng lại từ đầu
            }

            const item = data[currentIndex];
            document.getElementById('slide-img').src = item.img;
            document.getElementById('slide-title').innerText = item.title;
            document.getElementById('slide-desc').innerText = item.desc;
            document.getElementById('slide-bullets').innerHTML = item.bullets;

            if (isPlaying) {
                playSpeech(item.fullText);
            }
        }

        function playSpeech(text) {
            if (!synth) {
                scheduleNextSlide();
                return;
            }

            synth.cancel(); // Hủy mọi tiến trình đọc cũ

            // Trì hoãn nhỏ để đảm bảo bộ đệm âm thanh của trình duyệt được làm sạch
            setTimeout(() => {
                if (!isPlaying) return;

                globalUtterance = new SpeechSynthesisUtterance(text);
                globalUtterance.lang = 'vi-VN';
                globalUtterance.rate = 0.95; // Tốc độ đọc chuẩn, không quá nhanh

                // BẮT BUỘC ĐỌC XONG MỚI CHUYỂN
                globalUtterance.onend = function() {
                    if (isPlaying) {
                        scheduleNextSlide();
                    }
                };

                globalUtterance.onerror = function() {
                    if (isPlaying) {
                        scheduleNextSlide();
                    }
                };

                synth.speak(globalUtterance);
            }, 300);
        }

        function scheduleNextSlide() {
            clearTimeout(slideTimeout);
            // Nghỉ 1.5 giây sau khi đọc xong slide này rồi mới chuyển sang slide tiếp theo
            slideTimeout = setTimeout(() => {
                if (isPlaying) {
                    currentIndex++;
                    updateSlide();
                }
            }, 1500);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('playPauseBtn');
            if (isPlaying) {
                btn.innerText = "Tạm dừng";
                updateSlide();
            } else {
                btn.innerText = "Tiếp tục";
                synth.cancel();
                clearTimeout(slideTimeout);
            }
        }

        function nextSlide() {
            synth.cancel();
            clearTimeout(slideTimeout);
            currentIndex++;
            updateSlide();
        }

        // Kích hoạt trình chiếu sau cú click đầu tiên của người dùng (chính sách bảo mật âm thanh của trình duyệt)
        window.onload = () => {
            document.body.addEventListener('click', () => {
                if (!synth.speaking && isPlaying && currentIndex === 0 && !synth.pending) {
                    updateSlide();
                }
            }, { once: true });

            updateSlide();
        };
    </script>
</body>
