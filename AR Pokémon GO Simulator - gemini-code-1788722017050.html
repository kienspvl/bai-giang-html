<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Pokémon GO Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }
        .hud-panel {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #pokemon-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }
        #pokemon-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
            animation: bounce 1.5s infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }
        #catch-btn {
            pointer-events: auto;
            background: #ffcb05;
            color: #2a75bb;
            font-weight: bold;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: none;
            margin-top: 10px;
        }
        #catch-btn:hover {
            background: #ffdb4d;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        #start-screen h1 {
            color: #ffcb05;
            margin-bottom: 15px;
        }
        #start-screen p {
            margin-bottom: 25px;
            max-width: 400px;
            line-height: 1.5;
            color: #ddd;
        }
        #start-btn {
            background: #3b4cca;
            color: #ffcb05;
            font-weight: bold;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(59, 76, 202, 0.5);
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>AR Pokémon GO</h1>
        <p>Một chú Pikachu xuất hiện ở gần bạn! Hãy cho phép truy cập Camera và Vị trí, sau đó di chuyển thật nhanh tới gần vị trí của Pokémon trước khi hết giờ.</p>
        <button id="start-btn" onclick="startGame()">Bắt đầu săn</button>
    </div>

    <video id="camera-feed" autoplay playsinline muted></video>

    <div id="overlay">
        <div class="hud-panel">
            <div>⏱️ Thời gian: <span id="timer">30</span>s</div>
            <div>📍 Khoảng cách: <span id="distance">--</span> mét</div>
        </div>
    </div>

    <div id="pokemon-container">
        <img id="pokemon-img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Pikachu">
        <br>
        <button id="catch-btn" onclick="catchPokemon()">BẮT POKÉMON!</button>
    </div>

    <script>
        let timeLeft = 30;
        let timerInterval;
        let targetLat, targetLon;
        let watchId;
        const CATCH_THRESHOLD = 5; // Khoảng cách tối đa (mét) để được bắt

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            initCamera();
            initLocation();
            startTimer();
        }

        // 1. Khởi động Camera sau của điện thoại
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }
                });
                document.getElementById('camera-feed').srcObject = stream;
            } catch (err) {
                // Fallback nếu không mở được camera sau (ví dụ chạy trên máy tính laptop)
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    document.getElementById('camera-feed').srcObject = stream;
                } catch (e) {
                    alert("Không thể truy cập camera: " + e.message);
                }
            }
        }

        // 2. Thiết lập tọa độ ngẫu nhiên gần vị trí hiện tại của người dùng (bán kính ~20-40 mét)
        function initLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    const currentLat = position.coords.latitude;
                    const currentLon = position.coords.longitude;

                    // Tạo tọa độ giả lập cách vị trí hiện tại một khoảng ngẫu nhiên (khoảng 20-40m)
                    const angle = Math.random() * 2 * Math.PI;
                    const radius = 20 + Math.random() * 20; // mét
                    
                    // Quy đổi mét sang độ vĩ tuyến / kinh tuyến xấp xỉ
                    const dLat = (radius / 111320) * Math.cos(angle);
                    const dLon = (radius / (111320 * Math.cos(currentLat * (Math.PI / 180)))) * Math.sin(angle);

                    targetLat = currentLat + dLat;
                    targetLon = currentLon + dLon;

                    // Theo dõi vị trí liên tục của người dùng khi di chuyển
                    watchId = navigator.geolocation.watchPosition(updateUserPosition, handleLocationError, {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 5000
                    });
                }, handleLocationError, { enableHighAccuracy: true });
            } else {
                alert("Trình duyệt của bạn không hỗ trợ định vị GPS.");
            }
        }

        // 3. Tính khoảng cách theo công thức Haversine (trả về đơn vị mét)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Bán kính trái đất tính bằng mét
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c; 
        }

        function updateUserPosition(position) {
            const userLat = position.coords.latitude;
            const userLon = position.coords.longitude;

            const distance = calculateDistance(userLat, userLon, targetLat, targetLon);
            document.getElementById('distance').innerText = Math.round(distance);

            const catchBtn = document.getElementById('catch-btn');
            const pokemonImg = document.getElementById('pokemon-img');

            // Kiểm tra nếu người dùng đã chạy đến gần phạm vi cho phép
            if (distance <= CATCH_THRESHOLD) {
                catchBtn.style.display = 'inline-block';
                pokemonImg.style.transform = 'scale(1.3)';
            } else {
                catchBtn.style.display = 'none';
                pokemonImg.style.transform = 'scale(1.0)';
            }
        }

        function handleLocationError(error) {
            console.warn("Lỗi định vị: " + error.message);
            // Giá trị giả lập mô phỏng nếu đang test trên máy tính không có GPS di chuyển
            document.getElementById('distance').innerText = "Đang tìm GPS...";
        }

        // 4. Đồng hồ đếm ngược thời gian biến mất của Pokémon
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (watchId) navigator.geolocation.clearWatch(watchId);
                    alert("Tiếc quá! Pokémon đã chạy thoát mất rồi.");
                    location.reload();
                }
            }, 1000);
        }

        // 5. Xử lý khi bắt thành công
        function catchPokemon() {
            clearInterval(timerInterval);
            if (watchId) navigator.geolocation.clearWatch(watchId);
            alert("🎉 Chúc mừng! Bạn đã bắt được Pikachu thành công!");
            location.reload();
        }
    </script>
</body>
</html>
