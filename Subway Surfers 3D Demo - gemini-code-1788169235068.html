<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers 3D Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            display: none;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        #game-over h1 {
            margin-top: 0;
            color: #ff4757;
            font-size: 36px;
        }
        #restart-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #restart-btn:hover {
            background-color: #26af5f;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #aaa;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">Điểm: <span id="score">0</span></div>
    
    <div id="game-over">
        <h1>GAME OVER</h1>
        <p>Điểm của bạn: <span id="final-score">0</span></p>
        <button id="restart-btn" onclick="resetGame()">Chơi Lại</button>
    </div>

    <div id="instructions">Sử dụng phím mũi tên <b>Trái / Phải</b> để đổi làn | Mũi tên <b>Lên</b> để nhảy</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, player;
        let obstacles = [];
        let score = 0;
        let isGameOver = false;
        
        // Cấu hình làn đường
        const lanes = [-2.5, 0, 2.5];
        let currentLane = 1; // 0: Trái, 1: Giữa, 2: Phải
        
        // Trạng thái nhảy
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.015;

        function init() {
            // 1. Khởi tạo Scene, Camera, Renderer
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Trời xanh
            scene.fog = new THREE.Fog(0x87ceeb, 10, 60);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 8);
            camera.lookAt(0, 0, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 2. Ánh sáng
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // 3. Tạo đường ray / mặt đường
            createTrack();

            // 4. Tạo Nhân vật
            const playerGeo = new THREE.BoxGeometry(0.8, 1.2, 0.8);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x3498db });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(lanes[currentLane], 0.6, 0);
            scene.add(player);

            // 5. Bắt sự kiện bàn phím
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('resize', onWindowResize);

            // 6. Bắt đầu vòng lặp game
            animate();
            
            // Sinh chướng ngại vật định kỳ
            setInterval(spawnObstacle, 1500);
        }

        function createTrack() {
            // Mặt đường chính
            const trackGeo = new THREE.PlaneGeometry(8, 100);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            track.position.set(0, 0, -40);
            scene.add(track);

            // Vạch chia làn đường (màu vàng)
            for (let i = -1; i <= 1; i += 2) {
                const lineGeo = new THREE.PlaneGeometry(0.1, 100);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i * 1.25, 0.01, -40);
                scene.add(line);
            }
        }

        function spawnObstacle() {
            if (isGameOver) return;

            const obstacleGeo = new THREE.BoxGeometry(1.2, 1, 0.5);
            const obstacleMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
            const obstacle = new THREE.Mesh(obstacleGeo, obstacleMat);

            // Chọn ngẫu nhiên 1 trong 3 làn
            const randomLane = Math.floor(Math.random() * 3);
            obstacle.position.set(lanes[randomLane], 0.5, -40);

            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function handleKeyDown(e) {
            if (isGameOver) return;

            if (e.key === 'ArrowLeft' && currentLane > 0) {
                currentLane--;
            } else if (e.key === 'ArrowRight' && currentLane < 2) {
                currentLane++;
            } else if (e.key === 'ArrowUp' && !isJumping) {
                isJumping = true;
                jumpVelocity = 0.3; // Lực nhảy
            }
        }

        function updateGame() {
            if (isGameOver) return;

            // Di chuyển nhân vật mượt mà theo làn
            const targetX = lanes[currentLane];
            player.position.x += (targetX - player.position.x) * 0.2;

            // Xử lý logic nhảy
            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity -= gravity;

                // Khi rơi chạm đất
                if (player.position.y <= 0.6) {
                    player.position.y = 0.6;
                    isJumping = false;
                }
            }

            // Di chuyển và kiểm tra chướng ngại vật
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += 0.4; // Tốc độ chạy của chướng ngại vật

                // Kiểm tra va chạm (AABB Box Collision đơn giản)
                const obs = obstacles[i];
                if (
                    Math.abs(player.position.x - obs.position.x) < 0.7 &&
                    Math.abs(player.position.z - obs.position.z) < 0.7 &&
                    player.position.y < obs.position.y + 0.8
                ) {
                    triggerGameOver();
                }

                // Xóa vật cản khi đi qua màn hình
                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                }
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            // Xóa toàn bộ vật cản cũ khỏi scene
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];

            // Reset thông số
            score = 0;
            currentLane = 1;
            isJumping = false;
            document.getElementById('score').innerText = score;
            document.getElementById('game-over').style.display = 'none';
            player.position.set(lanes[currentLane], 0.6, 0);
            
            isGameOver = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            renderer.render(scene, camera);
        }

        // Khởi động game
        init();
    </script>
</body>
</html>
