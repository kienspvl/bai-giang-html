<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moto Racing 3D Ultimate</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 5;
        }
        /* Màn hình Menu Cài Đặt */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
        }
        #menu-screen h1 {
            color: #f1c40f;
            font-size: 32px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }
        .setting-group {
            margin: 12px 0;
            width: 85%;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 10px;
            text-align: left;
        }
        .setting-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #ddd;
        }
        .setting-group select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            background: #333;
            color: white;
            border: 1px solid #555;
            font-size: 16px;
        }
        #start-btn, #restart-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            transition: background 0.2s;
        }
        #start-btn:hover, #restart-btn:hover {
            background-color: #26af5f;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            display: none;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255,0,0,0.7);
            z-index: 15;
        }
        #game-over h1 {
            margin-top: 0;
            color: #ff4757;
            font-size: 38px;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #ccc;
            font-size: 13px;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1>MOTO RACING 3D</h1>
        
        <div class="setting-group">
            <label for="speed-select">🚀 Tốc độ ban đầu:</label>
            <select id="speed-select">
                <option value="15">Chậm (15 m/s)</option>
                <option value="25" selected>Bình thường (25 m/s)</option>
                <option value="38">Nhanh / Siêu tốc (38 m/s)</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="density-select">🚗 Mật độ vật cản:</label>
            <select id="density-select">
                <option value="1.8">Thưa thớt</option>
                <option value="1.2" selected>Bình thường</option>
                <option value="0.7">Dày đặc (Khó)</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="difficulty-select">🔥 Độ khó (Tốc độ tăng trưởng):</label>
            <select id="difficulty-select">
                <option value="0.2">Dễ (Tăng chậm)</option>
                <option value="0.5" selected>Trung bình</option>
                <option value="1.0">Ác mộng (Tăng cực nhanh)</option>
            </select>
        </div>

        <button id="start-btn" onclick="startGameSession()">BẮT ĐẦU ĐUA</button>
    </div>

    <div id="ui">
        Quãng đường: <span id="score">0</span> m<br>
        ⭐ Điểm thưởng: <span id="coins">0</span>
    </div>
    
    <div id="game-over">
        <h1>TAI NẠN!</h1>
        <p>Quãng đường đi được: <span id="final-score">0</span> m</p>
        <p>Điểm thưởng: <span id="final-coins">0</span></p>
        <br>
        <button id="restart-btn" onclick="resetGame()">Chơi Lại</button>
    </div>

    <div id="instructions">
        <b>Mobile</b>: Nghiêng điện thoại Trái/Phải để lái | <b>PC</b>: Phím Trái/Phải
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, player;
        let obstacles = [];
        let coins = [];
        let score = 0;
        let coinCount = 0;
        let isGameStarted = false;
        let isGameOver = false;
        
        // Cấu hình thông số từ Menu
        let gameSpeed = 25;
        let baseSpeed = 25;
        let spawnIntervalFactor = 1.2;
        let difficultyMultiplier = 0.5;
        
        const lanes = [-2.5, 0, 2.5];
        let currentLane = 1; // 0: Trái, 1: Giữa, 2: Phải
        let targetPlayerX = 0;

        let clock = new THREE.Clock();
        let spawnTimerObs = 0;
        let spawnTimerCoin = 0;

        let audioCtx;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            startBGM();
        }

        function startBGM() {
            if (bgmInterval) return;
            const notes = [220, 246.94, 277.18, 329.63, 369.99, 329.63, 277.18, 246.94];
            let noteIndex = 0;

            bgmInterval = setInterval(() => {
                if (isGameOver || !isGameStarted || !audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);
                    
                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);

                    noteIndex = (noteIndex + 1) % notes.length;
                } catch(e) {}
            }, 200);
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(900, now);
                    osc.frequency.exponentialRampToValueAtTime(1500, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'hit') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(30, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch(e) {}
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e272e);
            scene.fog = new THREE.Fog(0x1e272e, 20, 90);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.2, 7.0);
            camera.lookAt(0, 0.5, -4);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Ánh sáng đường đua đêm/hoàng hôn
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            createRoad();
            createPlayerMoto();

            // Xử lý sự kiện bàn phím (dự phòng cho PC)
            window.addEventListener('keydown', (e) => {
                if (!isGameStarted || isGameOver) return;
                if (e.key === 'ArrowLeft' && currentLane > 0) {
                    currentLane--;
                } else if (e.key === 'ArrowRight' && currentLane < 2) {
                    currentLane++;
                }
                targetPlayerX = lanes[currentLane];
            });

            // Xử lý cảm biến nghiêng điện thoại (DeviceOrientation)
            window.addEventListener('deviceorientation', (e) => {
                if (!isGameStarted || isGameOver) return;
                let gamma = e.gamma; // Góc nghiêng trái/phải (-90 đến 90)
                if (gamma !== null) {
                    if (gamma < -12) {
                        currentLane = 0; // Nghiêng trái -> Sang làn trái
                    } else if (gamma > 12) {
                        currentLane = 2; // Nghiêng phải -> Sang làn phải
                    } else {
                        currentLane = 1; // Giữ thẳng -> Làn giữa
                    }
                    targetPlayerX = lanes[currentLane];
                }
            }, true);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createRoad() {
            // Mặt đường nhựa
            const roadGeo = new THREE.PlaneGeometry(9, 160);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, 0, -70);
            scene.add(road);

            // Vạch kẻ đường phân làn trắng vàng
            for (let i = -1; i <= 1; i += 2) {
                const lineGeo = new THREE.PlaneGeometry(0.15, 160);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i * 1.35, 0.02, -70);
                scene.add(line);
            }
        }

        // Tạo mô hình xe máy đơn giản 3D
        function createPlayerMoto() {
            player = new THREE.Group();

            // Thân xe
            const bodyGeo = new THREE.BoxGeometry(0.6, 0.5, 1.4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, metalness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;

            // Đầu xe / Tay lái
            const handleGeo = new THREE.BoxGeometry(0.9, 0.1, 0.2);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0xecf0f1 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.set(0, 0.8, 0.4);

            // Bánh xe
            const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            
            const frontWheel = new THREE.Mesh(wheelGeo, wheelMat);
            frontWheel.rotation.z = Math.PI / 2;
            frontWheel.position.set(0, 0.3, 0.6);

            const rearWheel = new THREE.Mesh(wheelGeo, wheelMat);
            rearWheel.rotation.z = Math.PI / 2;
            rearWheel.position.set(0, 0.3, -0.6);

            player.add(body, handle, frontWheel, rearWheel);
            player.position.set(lanes[currentLane], 0, 0);
            scene.add(player);
        }

        // Sinh ô tô cản đường ngẫu nhiên
        function spawnObstacle() {
            const randomLane = Math.floor(Math.random() * 3);
            const carGroup = new THREE.Group();

            // Thân ô tô
            const carGeo = new THREE.BoxGeometry(1.2, 0.8, 2.2);
            const colors = [0x3498db, 0x2ecc71, 0x9b59b6, 0xf1c40f, 0xe67e22];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const carMat = new THREE.MeshStandardMaterial({ color: randomColor, roughness: 0.3 });
            const carBody = new THREE.Mesh(carGeo, carMat);
            carBody.position.y = 0.4;

            // Cabin ô tô
            const cabinGeo = new THREE.BoxGeometry(1.0, 0.5, 1.2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.9, -0.1);

            carGroup.add(carBody, cabin);
            carGroup.position.set(lanes[randomLane], 0, -75);
            scene.add(carGroup);
            obstacles.push(carGroup);
        }

        // Sinh vật phẩm ngôi sao thưởng điểm
        function spawnCoins() {
            const randomLane = Math.floor(Math.random() * 3);
            const starGeo = new THREE.OctahedronGeometry(0.35);
            const starMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, emissive: 0xf1c40f, emissiveIntensity: 0.5 });
            
            for (let i = 0; i < 3; i++) {
                const star = new THREE.Mesh(starGeo, starMat);
                star.position.set(lanes[randomLane], 0.6, -75 - (i * 1.8));
                scene.add(star);
                coins.push(star);
            }
        }

        function startGameSession() {
            // Lấy giá trị từ các thẻ select trong Menu
            baseSpeed = parseFloat(document.getElementById('speed-select').value);
            gameSpeed = baseSpeed;
            spawnIntervalFactor = parseFloat(document.getElementById('density-select').value);
            difficultyMultiplier = parseFloat(document.getElementById('difficulty-select').value);

            // Ẩn menu, hiện game
            document.getElementById('menu-screen').style.display = 'none';
            isGameStarted = true;
            clock.getDelta(); // Khởi tạo lại delta tránh giật khung hình đầu tiên

            initAudio();
        }

        function updateGame() {
            if (!isGameStarted || isGameOver) return;

            let delta = clock.getDelta();

            // Tăng tốc độ game tuyến tính theo thời gian và độ khó đã chọn
            if (gameSpeed < 55) {
                gameSpeed += delta * (0.25 * difficultyMultiplier);
            }

            // Tính điểm quãng đường (mét)
            score += Math.floor(gameSpeed * delta * 1.5);
            document.getElementById('score').innerText = score;

            // Quản lý thời gian sinh vật cản dựa theo mật độ
            spawnTimerObs += delta;
            if (spawnTimerObs > (spawnIntervalFactor / (gameSpeed / baseSpeed))) {
                spawnObstacle();
                spawnTimerObs = 0;
            }

            // Quản lý thời gian sinh ngôi sao
            spawnTimerCoin += delta;
            if (spawnTimerCoin > 1.5) {
                spawnCoins();
                spawnTimerCoin = 0;
            }

            // Di chuyển xe máy mượt mà theo làn đường hướng nghiêng
            player.position.x += (targetPlayerX - player.position.x) * (delta * 12);
            // Nghiêng nhẹ xe khi cua góc tạo cảm giác chân thực
            player.rotation.z = (targetPlayerX - player.position.x) * -0.15;

            // Cập nhật vị trí vật cản (Ô tô)
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += gameSpeed * delta;

                // Kiểm tra va chạm AABB chính xác giữa xe máy và ô tô
                if (Math.abs(player.position.x - obs.position.x) < 0.9 && Math.abs(obs.position.z) < 1.2) {
                    triggerGameOver();
                }

                if (obs.position.z > 6) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // Cập nhật ngôi sao thưởng
            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                c.rotation.y += delta * 4;
                c.position.z += gameSpeed * delta;

                if (Math.abs(player.position.x - c.position.x) < 0.7 && Math.abs(c.position.z) < 0.8) {
                    scene.remove(c);
                    coins.splice(i, 1);
                    coinCount++;
                    score += 30;
                    document.getElementById('coins').innerText = coinCount;
                    playSound('coin');
                    continue;
                }

                if (c.position.z > 6) {
                    scene.remove(c);
                    coins.splice(i, 1);
                }
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            playSound('hit');
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-coins').innerText = coinCount;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            coins.forEach(c => scene.remove(c));
            obstacles = [];
            coins = [];

            score = 0;
            coinCount = 0;
            gameSpeed = baseSpeed;
            currentLane = 1;
            targetPlayerX = 0;
            spawnTimerObs = 0;
            spawnTimerCoin = 0;
            clock = new THREE.Clock();

            player.position.set(lanes[currentLane], 0, 0);
            player.rotation.z = 0;

            document.getElementById('score').innerText = score;
            document.getElementById('coins').innerText = coinCount;
            document.getElementById('game-over').style.display = 'none';
            isGameOver = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
