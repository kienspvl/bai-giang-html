<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers 3D Pro</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            display: none;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255,0,0,0.6);
        }
        #game-over h1 {
            margin-top: 0;
            color: #ff4757;
            font-size: 38px;
        }
        #restart-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #restart-btn:hover {
            background-color: #26af5f;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #ccc;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

    <div id="ui">
        Điểm: <span id="score">0</span><br>
        💰 Đồng xu: <span id="coins">0</span>
    </div>
    
    <div id="game-over">
        <h1>GAME OVER</h1>
        <p>Điểm cuối: <span id="final-score">0</span></p>
        <p>Đồng xu thu thập: <span id="final-coins">0</span></p>
        <button id="restart-btn" onclick="resetGame()">Chơi Lại</button>
    </div>

    <div id="instructions">
        <b>Trái / Phải</b>: Đổi làn | <b>Mũi tên Lên</b>: Nhảy | <b>Mũi tên Xuống</b>: Cúi đầu (né rào chắn cao)
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, player;
        let obstacles = [];
        let coins = [];
        let score = 0;
        let coinCount = 0;
        let isGameOver = false;
        
        // Tốc độ game tăng dần theo thời gian
        let gameSpeed = 0.4;
        const baseSpeed = 0.4;
        
        // Cấu hình làn đường
        const lanes = [-2.5, 0, 2.5];
        let currentLane = 1;
        
        // Trạng thái nhân vật (Nhảy & Cúi)
        let isJumping = false;
        let isDucking = false;
        let jumpVelocity = 0;
        const gravity = 0.018;
        let duckTimer = 0;

        // Trình quản lý âm thanh sử dụng Web Audio API (Không cần file ngoài)
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'jump') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch(e) {
                // Xử lý chặn autoplay của trình duyệt nếu có
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 10, 70);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 8.5);
            camera.lookAt(0, 0, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Ánh sáng
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 25, 10);
            scene.add(dirLight);

            createTrack();

            // Tạo nhân vật (Group chứa thân và đầu để dễ biến đổi khi cúi)
            player = new THREE.Group();
            
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3498db });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.position.y = 0.6;
            player.add(bodyMesh);

            player.position.set(lanes[currentLane], 0, 0);
            scene.add(player);

            window.addEventListener('keydown', (e) => {
                initAudio();
                handleKeyDown(e);
            });
            window.addEventListener('resize', onWindowResize);

            animate();
            
            // Sinh vật cản và tiền vàng định kỳ
            setInterval(spawnObstacle, 1400);
            setInterval(spawnCoins, 1000);
        }

        function createTrack() {
            const trackGeo = new THREE.PlaneGeometry(8, 120);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x2f3640 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            track.position.set(0, 0, -50);
            scene.add(track);

            for (let i = -1; i <= 1; i += 2) {
                const lineGeo = new THREE.PlaneGeometry(0.12, 120);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i * 1.25, 0.01, -50);
                scene.add(line);
            }
        }

        function spawnObstacle() {
            if (isGameOver) return;

            const type = Math.floor(Math.random() * 3); // 0: Rào thấp, 1: Rào cao (cần cúi), 2: Dốc nhảy
            const randomLane = Math.floor(Math.random() * 3);
            const obstacleGroup = new THREE.Group();

            if (type === 0) {
                // Rào thấp (Phải nhảy qua)
                const obsGeo = new THREE.BoxGeometry(1.2, 0.9, 0.4);
                const obsMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
                const mesh = new THREE.Mesh(obsGeo, obsMat);
                mesh.position.y = 0.45;
                obstacleGroup.add(mesh);
                obstacleGroup.userData = { type: 'low', height: 0.9 };
            } else if (type === 1) {
                // Rào cao (Phải cúi đầu hoặc đi làn khác)
                const poleGeo = new THREE.BoxGeometry(0.2, 2.2, 0.2);
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
                
                const p1 = new THREE.Mesh(poleGeo, poleMat); p1.position.set(-0.6, 1.1, 0);
                const p2 = new THREE.Mesh(poleGeo, poleMat); p2.position.set(0.6, 1.1, 0);
                
                const topGeo = new THREE.BoxGeometry(1.4, 0.4, 0.4);
                const topMat = new THREE.MeshStandardMaterial({ color: 0xc0392b });
                const top = new THREE.Mesh(topGeo, topMat);
                top.position.set(0, 2.0, 0);

                obstacleGroup.add(p1, p2, top);
                obstacleGroup.userData = { type: 'high', minY: 1.5 }; // Nếu player.y < minY mà không cúi thì chết
            } else {
                // Dốc nhảy (Giúp nhảy cao hơn hoặc bay qua vật cản)
                const rampGeo = new THREE.BoxGeometry(1.2, 0.4, 1.5);
                const rampMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71 });
                const mesh = new THREE.Mesh(rampGeo, rampMat);
                mesh.rotation.x = -0.3;
                mesh.position.y = 0.2;
                obstacleGroup.add(mesh);
                obstacleGroup.userData = { type: 'ramp' };
            }

            obstacleGroup.position.set(lanes[randomLane], 0, -55);
            scene.add(obstacleGroup);
            obstacles.push(obstacleGroup);
        }

        function spawnCoins() {
            if (isGameOver) return;
            const randomLane = Math.floor(Math.random() * 3);
            const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.8, roughness: 0.2 });
            
            // Tạo chuỗi 3 đồng xu liên tiếp
            for (let i = 0; i < 3; i++) {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.z = Math.PI / 2;
                coin.position.set(lanes[randomLane], 0.6, -55 - (i * 1.5));
                scene.add(coin);
                coins.push(coin);
            }
        }

        function handleKeyDown(e) {
            if (isGameOver) return;

            if (e.key === 'ArrowLeft' && currentLane > 0) {
                currentLane--;
            } else if (e.key === 'ArrowRight' && currentLane < 2) {
                currentLane++;
            } else if (e.key === 'ArrowUp' && !isJumping && !isDucking) {
                isJumping = true;
                jumpVelocity = 0.35;
                playSound('jump');
            } else if (e.key === 'ArrowDown' && !isJumping && !isDucking) {
                isDucking = true;
                duckTimer = 30; // Số khung hình cúi
                player.scale.set(1, 0.5, 1); // Thu nhỏ nhân vật lại
                player.position.y = 0;
            }
        }

        function updateGame() {
            if (isGameOver) return;

            // Tăng tốc độ game dần theo thời gian (tối đa tới giới hạn 0.9)
            if (gameSpeed < 0.9) {
                gameSpeed += 0.00005;
            }

            // Di chuyển làn mượt mà
            const targetX = lanes[currentLane];
            player.position.x += (targetX - player.position.x) * 0.2;

            // Xử lý nhảy
            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity -= gravity;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumping = false;
                }
            }

            // Xử lý cúi đầu
            if (isDucking) {
                duckTimer--;
                if (duckTimer <= 0) {
                    isDucking = false;
                    player.scale.set(1, 1, 1);
                }
            }

            // Cập nhật chướng ngại vật
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += gameSpeed;

                // Kiểm tra va chạm
                if (Math.abs(player.position.x - obs.position.x) < 0.7 && Math.abs(obs.position.z) < 0.6) {
                    let data = obs.userData;
                    if (data.type === 'low') {
                        if (player.position.y < 0.8) { triggerGameOver(); }
                    } else if (data.type === 'high') {
                        if (!isDucking || player.position.y >= 0.5) { triggerGameOver(); }
                    } else if (data.type === 'ramp') {
                        // Bay cao hơn khi qua dốc nhảy
                        isJumping = true;
                        jumpVelocity = 0.45;
                        playSound('jump');
                        // Xóa dốc ngay sau khi chạm để tránh kích hoạt liên tục
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        continue;
                    }
                }

                // Xóa chướng ngại vật khi qua khỏi màn hình
                if (obs.position.z > 6) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 15;
                    document.getElementById('score').innerText = score;
                }
            }

            // Cập nhật đồng xu & hiệu ứng xoay
            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                c.rotation.x += 0.05;
                c.position.z += gameSpeed;

                // Kiểm tra nhặt xu
                if (Math.abs(player.position.x - c.position.x) < 0.6 && 
                    Math.abs(player.position.z - c.position.z) < 0.6 && 
                    player.position.y < 1.2) {
                    scene.remove(c);
                    coins.splice(i, 1);
                    coinCount++;
                    score += 50;
                    document.getElementById('coins').innerText = coinCount;
                    document.getElementById('score').innerText = score;
                    playSound('coin');
                    continue;
                }

                if (c.position.z > 6) {
                    scene.remove(c);
                    coins.splice(i, 1);
                }
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            playSound('hit');
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-coins').innerText = coinCount;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            coins.forEach(c => scene.remove(c));
            obstacles = [];
            coins = [];

            score = 0;
            coinCount = 0;
            gameSpeed = baseSpeed;
            currentLane = 1;
            isJumping = false;
            isDucking = false;
            player.scale.set(1, 1, 1);
            player.position.set(lanes[currentLane], 0, 0);

            document.getElementById('score').innerText = score;
            document.getElementById('coins').innerText = coinCount;
            document.getElementById('game-over').style.display = 'none';
            isGameOver = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
